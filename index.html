<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市價徵收查估作業系統 v1.1.0 - 含診斷工具</title>
    
    <!-- ==================== CDN 引入 ==================== -->
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Turf.js -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    
    <!-- proj4.js（座標轉換）-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.min.js"></script>
    
    <!-- shpjs（SHP 檔案讀取）-->
    <script src="https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.min.js"></script>
    
    <!-- xlsx.js（Excel 匯出）-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    
    <!-- JSZip（ZIP 壓縮）-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- shp-write（SHP 匯出）-->
    <script src="https://cdn.jsdelivr.net/npm/shp-write@0.0.3/index.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .info-panel {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
        }

        .toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 999;
            padding: 10px;
        }

        .toolbar button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin: 5px 0;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .toolbar button:hover {
            background-color: #005a9e;
        }

        .console-hint {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background-color: #4caf50;
            color: white;
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 998;
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-300px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="toolbar">
        <button onclick="importGeoJSON()">📥 匯入 GeoJSON</button>
        <button onclick="exportGeoJSON()">📤 匯出 GeoJSON</button>
        <button onclick="drawPolygon()">✏️ 繪製多邊形</button>
        <button onclick="clearAll()">🗑️ 清除全部</button>
        <button onclick="diagQuick()">🔍 快速檢查</button>
    </div>

    <div class="console-hint">
        💡 <strong>診斷工具已就緒</strong><br>
        打開 F12 → Console，執行:<br>
        <code>diagQuick()</code> / <code>diagVis()</code> / <code>diagCoord()</code> / <code>diagPrint()</code>
    </div>

    <!-- ==================== 主要業務邏輯 ==================== -->
    <script>
        // ========== 全局變數 ==========
        let map;
        let geoJsonLayers = {};
        let geoJsonFeatures = {};
        let polygons = [];
        let results = [];
        let baseMaps = {};
        let isDrawing = false;
        let currentDrawingPoints = [];

        // ========== 地圖初始化 ==========
        function initMap() {
            map = L.map('map').setView([25.0330, 121.5654], 13);

            // 基底圖層
            const nlsc = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default//GoogleMapsCompatible_Level{z}/{y}/{x}.png', {
                maxZoom: 20,
                attribution: '© 國家地理資訊系統'
            });

            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            });

            baseMaps = {
                'NLSC EMAP': nlsc,
                'OpenStreetMap': osm
            };

            nlsc.addTo(map);
            L.control.layers(baseMaps).addTo(map);

            console.log('%c✅ 地圖初始化完成', 'color: green; font-weight: bold;');
        }

        // ========== GeoJSON 匯入 ==========
        function importGeoJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,.geojson';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const geojson = JSON.parse(event.target.result);
                        const normalized = normalizeGeoJSON(geojson);
                        const layerName = file.name.replace(/\.[^.]+$/, '');
                        
                        geoJsonFeatures[layerName] = normalized;
                        
                        const layer = L.geoJSON(normalized, {
                            style: (feature) => extractStyleFromProperties(feature.properties),
                            onEachFeature: (feature, layer) => {
                                layer.bindPopup(createPropertyPopup(feature.properties));
                            }
                        }).addTo(map);

                        geoJsonLayers[layerName] = layer;
                        
                        map.fitBounds(layer.getBounds());
                        alert(`✅ 已加載: ${layerName} (${normalized.features.length} 個特徵)`);
                        console.log(`✅ GeoJSON 已匯入: ${layerName}`);
                    } catch (err) {
                        console.error('❌ GeoJSON 解析失敗:', err);
                        alert('❌ GeoJSON 格式錯誤：' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ========== GeoJSON 正規化 ==========
        function normalizeGeoJSON(geojson) {
            if (!geojson) return { type: 'FeatureCollection', features: [] };

            let data = geojson;
            let iterations = 0;
            const maxIterations = 10;

            while ((data.type === 'FeatureCollection' && data.features && data.features.length > 0) ||
                   (data.type !== 'FeatureCollection')) {
                if (iterations >= maxIterations) break;

                if (data.type === 'Feature') {
                    data = { type: 'FeatureCollection', features: [data] };
                } else if (data.type === 'FeatureCollection' && data.features[0]?.type === 'FeatureCollection') {
                    let allFeatures = [];
                    data.features.forEach(f => {
                        if (f.features) allFeatures.push(...f.features);
                        else allFeatures.push(f);
                    });
                    data = { type: 'FeatureCollection', features: allFeatures };
                } else if (data.type && data.type !== 'FeatureCollection' && !data.features) {
                    data = { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: data, properties: {} }] };
                } else {
                    break;
                }
                iterations++;
            }

            // MultiPolygon 拆分
            let expandedFeatures = [];
            data.features.forEach((feature, idx) => {
                if (feature.geometry?.type === 'MultiPolygon') {
                    feature.geometry.coordinates.forEach((coords, subIdx) => {
                        const newFeature = {
                            ...feature,
                            geometry: { type: 'Polygon', coordinates: coords },
                            properties: {
                                ...feature.properties,
                                originalName: feature.properties.name,
                                multiPolygonIndex: subIdx + 1
                            }
                        };
                        expandedFeatures.push(newFeature);
                    });
                } else {
                    expandedFeatures.push(feature);
                }
            });

            return { type: 'FeatureCollection', features: expandedFeatures };
        }

        // ========== 樣式提取 ==========
        function extractStyleFromProperties(props) {
            if (!props) return { color: '#3388ff', fillOpacity: 0.2 };

            const namedColors = {
                'red': '#ff0000', 'blue': '#0000ff', 'green': '#00ff00',
                'yellow': '#ffff00', 'purple': '#800080', 'orange': '#ffa500'
            };

            let fillColor = props.fill_color || props.fillColor || props.color || '#3388ff';
            
            if (namedColors[fillColor]) {
                fillColor = namedColors[fillColor];
            }

            return {
                color: props.stroke_color || props.color || '#333',
                fillColor: fillColor,
                fillOpacity: parseFloat(props.opacity || 0.2),
                weight: parseInt(props.weight || 2)
            };
        }

        // ========== 屬性彈窗 ==========
        function createPropertyPopup(props) {
            let html = '<table style="font-size:12px; width:100%;">';
            Object.entries(props || {}).forEach(([key, value]) => {
                const escapedValue = String(value || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                html += `<tr><td style="font-weight:bold;">${key}</td><td>${escapedValue}</td></tr>`;
            });
            html += '</table>';
            return html;
        }

        // ========== 多邊形繪製 ==========
        function drawPolygon() {
            if (isDrawing) {
                isDrawing = false;
                alert('❌ 已取消繪製');
                return;
            }

            isDrawing = true;
            currentDrawingPoints = [];
            alert('✏️ 開始繪製多邊形，點擊地圖添加頂點，雙擊完成');

            map.on('click', addDrawingPoint);
            map.on('dblclick', completeDrawing);
        }

        function addDrawingPoint(e) {
            if (!isDrawing) return;
            currentDrawingPoints.push([e.latlng.lat, e.latlng.lng]);
            L.circleMarker([e.latlng.lat, e.latlng.lng], { radius: 4, color: 'red' }).addTo(map);
        }

        function completeDrawing(e) {
            if (!isDrawing || currentDrawingPoints.length < 3) {
                alert('❌ 至少需要 3 個頂點');
                return;
            }

            isDrawing = false;
            map.off('click', addDrawingPoint);
            map.off('dblclick', completeDrawing);

            const polygon = L.polygon(currentDrawingPoints, { color: '#ff0000', fillOpacity: 0.3 }).addTo(map);
            
            const coords = [[currentDrawingPoints.map(p => [p[1], p[0]]), [currentDrawingPoints[0][1], currentDrawingPoints[0][0]]]];
            const area = turf.area(turf.polygon(coords));

            const polyData = {
                id: 'poly_' + Date.now(),
                points: currentDrawingPoints,
                color: '#ff0000',
                area: area,
                polygon: polygon
            };

            polygons.push(polyData);
            console.log(`✅ 多邊形已繪製, 面積: ${(area / 10000).toFixed(2)} 公頃`);
        }

        // ========== GeoJSON 匯出 ==========
        function exportGeoJSON() {
            const allFeatures = [];
            Object.values(geoJsonFeatures).forEach(fc => {
                if (fc.features) allFeatures.push(...fc.features);
            });

            const geojson = {
                type: 'FeatureCollection',
                features: allFeatures
            };

            const dataStr = JSON.stringify(geojson, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `export_${Date.now()}.geojson`;
            a.click();
            URL.revokeObjectURL(url);
            console.log('✅ GeoJSON 已匯出');
        }

        // ========== 清除全部 ==========
        function clearAll() {
            if (confirm('確認要清除全部圖層和多邊形?')) {
                Object.values(geoJsonLayers).forEach(layer => map.removeLayer(layer));
                polygons.forEach(p => map.removeLayer(p.polygon));
                geoJsonLayers = {};
                geoJsonFeatures = {};
                polygons = [];
                console.log('✅ 已清除全部內容');
            }
        }

        // ========== 座標系統檢測 ==========
        function transformTWD97toWGS84(coords) {
            proj4.defs("EPSG:3826", "+proj=tmerc +lat_0=0 +lon_0=121 +k=0.9999 +x_0=250000 +y_0=0 +ellps=GRS80 +units=m +no_defs");
            return proj4("EPSG:3826", "WGS84", coords);
        }

        // ========== 歡迎訊息 ==========
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            setTimeout(() => {
                console.log('%c🎉 市價徵收查估系統 v1.1.0 已加載', 'color: blue; font-weight: bold; font-size: 16px;');
                console.log('%c✅ 診斷工具已就緒，請執行以下命令:', 'color: green; font-weight: bold;');
                console.log('%c  • diagQuick()  - 快速檢查', 'color: blue;');
                console.log('%c  • diagVis()    - 可見性檢查', 'color: blue;');
                console.log('%c  • diagCoord()  - 座標檢查', 'color: blue;');
                console.log('%c  • diagPrint()  - 完整報告', 'color: blue;');
            }, 500);
        });
    </script>

    <!-- ==================== 診斷系統（核心） ==================== -->
    <script>
        /**
         * ★ 全局診斷系統 ★
         * 包含四大診斷工具，用於排除 GeoJSON、多邊形、座標等問題
         */

        window.SystemDiagnostics = {
            // 主報告生成方法
            fullReport() {
                try {
                    const layerCount = Object.keys(geoJsonLayers).length;
                    const featureCount = Object.values(geoJsonFeatures).reduce((sum, fc) => sum + (fc.features?.length || 0), 0);
                    
                    return {
                        timestamp: new Date().toISOString(),
                        appVersion: 'v1.1.0',
                        leafletVersion: window.L.version,
                        geoJsonLayersCount: layerCount,
                        geoJsonLayerNames: Object.keys(geoJsonLayers),
                        totalFeatures: featureCount,
                        polygonsCount: polygons.length,
                        mapCenter: [map.getCenter().lat, map.getCenter().lng],
                        mapZoom: map.getZoom(),
                        activeBaseLayer: this._getActiveBaseLayer(),
                        turfVersion: '已加載',
                        proj4Version: '已加載'
                    };
                } catch (err) {
                    console.error('❌ 報告生成失敗:', err);
                    return { error: err.message };
                }
            },

            // 方法 1: 完整報告
            print() {
                console.clear();
                const report = this.fullReport();
                if (report.error) {
                    console.error('❌ 無法生成報告:', report.error);
                    return;
                }

                console.group('📊 系統完整診斷報告');
                console.log('⏰ 時間戳記:', report.timestamp);
                console.log('📦 應用版本:', report.appVersion);
                console.log('📦 Leaflet 版本:', report.leafletVersion);
                
                console.group('🗂️ GeoJSON 圖層');
                console.log(`總數: ${report.geoJsonLayersCount}`);
                console.log(`總特徵數: ${report.totalFeatures}`);
                if (report.geoJsonLayerNames.length > 0) {
                    console.log('圖層名稱:', report.geoJsonLayerNames);
                }
                console.groupEnd();

                console.group('📦 多邊形');
                console.log(`總數: ${report.polygonsCount}`);
                if (report.polygonsCount > 0) {
                    polygons.forEach((p, idx) => {
                        console.log(`  ${idx + 1}. ID: ${p.id}, 頂點: ${p.points.length}, 面積: ${(p.area / 10000).toFixed(2)} 公頃`);
                    });
                }
                console.groupEnd();

                console.group('🗺️ 地圖狀態');
                console.log('中心座標:', report.mapCenter);
                console.log('縮放級別:', report.mapZoom);
                console.log('活躍背景圖層:', report.activeBaseLayer);
                console.groupEnd();

                console.groupEnd();
            },

            // 方法 2: 快速檢查
            quickCheck() {
                console.clear();
                console.warn('⚠️ === 快速診斷檢查清單 ===\n');

                const checks = [
                    { name: '✅ GeoJSON 圖層已加載', pass: Object.keys(geoJsonLayers).length > 0, count: Object.keys(geoJsonLayers).length },
                    { name: '✅ 多邊形已繪製', pass: polygons.length > 0, count: polygons.length },
                    { name: '✅ 地圖中心有效', pass: map && map.getCenter() && typeof map.getCenter().lat === 'number' },
                    { name: '✅ 查詢結果存在', pass: results.length > 0, count: results.length }
                ];

                let passCount = 0;
                checks.forEach(check => {
                    const icon = check.pass ? '✅' : '❌';
                    const detail = check.count !== undefined ? ` (${check.count})` : '';
                    console.log(`${icon} ${check.name}${detail}`);
                    if (check.pass) passCount++;
                });

                console.log(`\n📈 檢查通過: ${passCount}/${checks.length}\n`);

                if (Object.keys(geoJsonLayers).length > 0) {
                    console.log('📌 GeoJSON 圖層詳情:');
                    Object.entries(geoJsonLayers).forEach(([name, layer]) => {
                        const features = geoJsonFeatures[name]?.features || [];
                        const isVisible = layer._map !== null;
                        const icon = isVisible ? '👁️' : '👁️‍🗨️';
                        console.log(`  ${icon} ${name}: ${features.length} 個特徵`);
                    });
                }
            },

            // 方法 3: 可見性檢查
            checkVisibility() {
                console.group('👁️ 圖層可見性檢查');
                
                console.log('🗺️ 背景圖層:');
                Object.entries(baseMaps).forEach(([name, layer]) => {
                    const isVisible = map.hasLayer(layer);
                    const icon = isVisible ? '✓' : '✗';
                    console.log(`  ${icon} ${name}: ${isVisible ? '可見' : '隱藏'}`);
                });

                console.log('\n📊 GeoJSON 圖層:');
                if (Object.keys(geoJsonLayers).length === 0) {
                    console.log('  (未加載任何圖層)');
                } else {
                    Object.entries(geoJsonLayers).forEach(([name, layer]) => {
                        const isVisible = layer._map !== null;
                        const icon = isVisible ? '✓' : '✗';
                        const status = isVisible ? '可見' : '隱藏';
                        console.log(`  ${icon} ${name}: ${status}`);
                        if (!isVisible) {
                            console.log(`     💡 建議: 在側邊欄或控制面板啟用此圖層`);
                        }
                    });
                }

                console.groupEnd();
            },

            // 方法 4: 座標檢查
            checkCoordinates() {
                console.group('🔍 座標有效性檢查');

                if (Object.keys(geoJsonFeatures).length === 0) {
                    console.log('(未加載任何 GeoJSON)');
                    console.groupEnd();
                    return;
                }

                Object.entries(geoJsonFeatures).forEach(([layerName, data]) => {
                    if (!data.features || data.features.length === 0) return;

                    console.group(layerName);
                    
                    let validWGS84 = 0, twd97 = 0, invalid = 0;

                    data.features.slice(0, 5).forEach((feature, idx) => {
                        if (feature.geometry?.coordinates) {
                            const coords = this._flattenCoordinates(feature.geometry.coordinates);
                            coords.slice(0, 1).forEach(coord => {
                                if (this._isTWD97(coord)) {
                                    twd97++;
                                    console.log(`  特徵 ${idx}: [${coord[0]}, ${coord[1]}] → TWD97 (自動轉換)`);
                                } else if (this._isValidWGS84(coord)) {
                                    validWGS84++;
                                    console.log(`  特徵 ${idx}: [${coord[0]}, ${coord[1]}] → WGS84 ✓`);
                                } else {
                                    invalid++;
                                    console.warn(`  特徵 ${idx}: [${coord[0]}, ${coord[1]}] → ⚠️ 無效座標`);
                                }
                            });
                        }
                    });

                    console.log(`\n統計 (檢查前 5 個特徵):`);
                    console.log(`  ✅ WGS84 有效: ${validWGS84}`);
                    if (twd97 > 0) console.log(`  🔄 TWD97: ${twd97}`);
                    if (invalid > 0) console.log(`  ❌ 無效: ${invalid}`);

                    console.groupEnd();
                });

                console.groupEnd();
            },

            // 私有方法
            _flattenCoordinates(coords, result = []) {
                if (coords[0] && typeof coords[0][0] === 'number') {
                    result.push(...coords);
                } else {
                    coords.forEach(c => this._flattenCoordinates(c, result));
                }
                return result;
            },

            _isTWD97(coord) {
                return coord[0] > 100000 && coord[0] < 400000 && 
                       coord[1] > 2000000 && coord[1] < 2900000;
            },

            _isValidWGS84(coord) {
                return Math.abs(coord[0]) <= 180 && Math.abs(coord[1]) <= 90;
            },

            _getActiveBaseLayer() {
                for (let [name, layer] of Object.entries(baseMaps)) {
                    if (map.hasLayer(layer)) return name;
                }
                return '未知';
            }
        };

        // ========== 全局快捷命令註冊 ==========
        window.diagPrint = () => window.SystemDiagnostics.print();
        window.diagQuick = () => window.SystemDiagnostics.quickCheck();
        window.diagVis = () => window.SystemDiagnostics.checkVisibility();
        window.diagCoord = () => window.SystemDiagnostics.checkCoordinates();

        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #4caf50; font-weight: bold;');
        console.log('%c💡 診斷工具已就緒 - 請執行以下命令:', 'color: green; font-weight: bold; font-size: 14px;');
        console.log('%c  diagPrint()  → 完整診斷報告（時戳、版本、圖層、多邊形、地圖狀態）', 'color: blue; font-family: monospace;');
        console.log('%c  diagQuick()  → 快速檢查清單（4 項基本檢查）', 'color: blue; font-family: monospace;');
        console.log('%c  diagVis()    → 圖層可見性檢查（找出隱藏圖層）', 'color: blue; font-family: monospace;');
        console.log('%c  diagCoord()  → 座標系統檢查（WGS84 vs TWD97）', 'color: blue; font-family: monospace;');
        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #4caf50; font-weight: bold;');
    </script>
</body>
</html>
