<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>NLSC URBAN 單張圖磚測試</title>

<style>

body {

    margin: 0;

    font-family:
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background: #eeeeee;

}

#panel {

    padding: 20px;

    background: white;

    border-bottom:
        1px solid #ccc;

}

#tileContainer {

    margin: 20px;

    width: 512px;

    min-height: 300px;

    background:
        repeating-conic-gradient(
            #eee 0% 25%,
            #fff 0% 50%
        )
        50% / 20px 20px;

    border:
        2px solid #333;

    position: relative;

}

#urbanTile {

    width: 256px;

    height: 256px;

    image-rendering: auto;

}

#status {

    margin-top: 10px;

    padding: 10px;

    background: #f5f5f5;

    border-radius: 5px;

}

button {

    padding: 8px 14px;

    margin-right: 5px;

    cursor: pointer;

}

</style>

</head>

<body>

<div id="panel">

```
<h2>NLSC URBAN 圖磚直接測試</h2>

<div>

    測試圖層：

    <b>URBAN</b>

</div>

<div>

    TileMatrix：

    <b>EPSG:3857</b>

</div>

<div>

    Z：

    <b>13</b>

</div>

<div>

    TileRow：

    <b>3508</b>

</div>

<div>

    TileCol：

    <b>6857</b>

</div>

<br>

<button onclick="loadTile()">

    載入 URBAN Tile

</button>

<button onclick="clearTile()">

    清除

</button>

<div id="status">

    尚未載入

</div>
```

</div>

<div id="tileContainer">

```
<img
    id="urbanTile"
    alt="NLSC URBAN Tile"
>
```

</div>

<script>


const TILE_URL =

    "https://wmts.nlsc.gov.tw/wmts/" +

    "URBAN/default/EPSG:3857/" +

    "13/3508/6857";


/* =====================================================
   載入 Tile
   ===================================================== */

function loadTile() {

    const img =
        document.getElementById(
            "urbanTile"
        );

    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML =
        "正在載入：<br>" +
        TILE_URL;


    console.log(
        "URBAN TILE URL：",
        TILE_URL
    );


    img.onload = function() {

        console.log(
            "URBAN Tile 載入成功"
        );


        console.log(
            "naturalWidth：",
            img.naturalWidth
        );


        console.log(
            "naturalHeight：",
            img.naturalHeight
        );


        status.innerHTML =

            "✅ URBAN Tile HTTP 載入成功<br><br>" +

            "圖片尺寸：" +
            img.naturalWidth +
            " × " +
            img.naturalHeight +
            "<br><br>" +

            TILE_URL;

    };


    img.onerror = function(error) {

        console.error(
            "URBAN Tile 載入失敗",
            error
        );


        status.innerHTML =

            "❌ URBAN Tile 載入失敗<br><br>" +

            TILE_URL;

    };


    img.src =
        TILE_URL +
        "?t=" +
        Date.now();

}


/* =====================================================
   清除
   ===================================================== */

function clearTile() {

    document.getElementById(
        "urbanTile"
    ).removeAttribute("src");


    document.getElementById(
        "status"
    ).innerHTML =
        "已清除";

}


/* =====================================================
   初始
   ===================================================== */

console.log(
    "================================"
);

console.log(
    "NLSC URBAN TILE TEST"
);

console.log(
    TILE_URL
);

console.log(
    "================================"
);

</script>

</body>

</html>
