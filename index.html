<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NLSC 所選範圍坡度分析</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

#map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =====================================================
   左上操作面板
===================================================== */

#toolbar {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;

    width: 285px;

    background:
        linear-gradient(
            145deg,
            #fffdf5,
            #fef3c7
        );

    border: 1px solid #fcd34d;
    border-radius: 16px;

    padding: 14px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.18);
}

#toolbar h3 {
    margin:
        0 0 12px 0;

    font-size: 18px;
}

.tool-row {
    margin-bottom: 9px;
}

.tool-row label {
    display: block;
    margin-bottom: 4px;

    font-size: 13px;
    font-weight: 700;
}

button,
select {
    width: 100%;

    box-sizing: border-box;

    min-height: 40px;

    border-radius: 9px;
    border: 1px solid #cbd5e1;

    background: #ffffff;

    padding:
        7px 10px;

    font-size: 14px;

    cursor: pointer;
}

button:hover {
    background: #f8fafc;
}

button.primary {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

button.primary:hover {
    background: #1d4ed8;
}

button.danger {
    background: #fee2e2;
    color: #991b1b;
    border-color: #fecaca;
}

.info-box {
    margin-top: 12px;

    padding: 10px;

    border-radius: 10px;

    background: rgba(255,255,255,.7);

    font-size: 12px;

    line-height: 1.6;
}

/* =====================================================
   右側坡度分析結果
===================================================== */

#slopePanel {
    position: absolute;

    top: 12px;
    right: 12px;

    z-index: 1000;

    width: 330px;

    max-height: calc(100vh - 24px);

    overflow-y: auto;

    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            #fffdf5,
            #fef3c7
        );

    border: 1px solid #fcd34d;

    border-radius: 16px;

    padding: 14px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.18);
}

#slopePanel h3 {
    margin:
        0 0 5px 0;

    font-size: 18px;
}

.panel-subtitle {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 12px;
}

.stat-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.stat-card {
    background: white;

    border:
        1px solid #e2e8f0;

    border-radius: 10px;

    padding: 9px;
}

.stat-label {
    font-size: 11px;
    color: #64748b;
}

.stat-value {
    margin-top: 3px;

    font-size: 17px;

    font-weight: 800;

    color: #1e293b;
}

.section-title {
    margin-top: 16px;
    margin-bottom: 8px;

    font-weight: 800;
    font-size: 14px;
}

.slope-row {
    display: grid;

    grid-template-columns:
        75px 1fr 50px;

    gap: 7px;

    align-items: center;

    margin-bottom: 8px;

    font-size: 12px;
}

.slope-bar {
    height: 13px;

    background: #e2e8f0;

    border-radius: 20px;

    overflow: hidden;
}

.slope-fill {
    height: 100%;
}

.s0 {
    background: #65a30d;
}

.s1 {
    background: #eab308;
}

.s2 {
    background: #f97316;
}

.s3 {
    background: #dc2626;
}

.note {
    margin-top: 12px;

    padding: 10px;

    border-radius: 10px;

    background: #eff6ff;

    color: #1e3a8a;

    font-size: 12px;

    line-height: 1.6;
}

/* =====================================================
   Leaflet 控制項
===================================================== */

.leaflet-control-layers {
    border-radius: 10px !important;
}

.leaflet-control-scale {
    margin-bottom: 25px !important;
}

/* =====================================================
   Polygon
===================================================== */

.analysis-polygon {
    stroke: #dc2626;

    stroke-width: 3;

    fill: #facc15;

    fill-opacity: .12;
}
</style>
</head>

<body>

<div id="map"></div>


<!-- =====================================================
     左側工具列
===================================================== -->

<div id="toolbar">

    <h3>⛰️ NLSC 坡度分析</h3>

    <div class="tool-row">

        <button
            id="drawBtn"
            class="primary"
        >
            ✏️ 開始繪製分析範圍
        </button>

    </div>


    <div class="tool-row">

        <button
            id="finishBtn"
        >
            ✔ 完成範圍
        </button>

    </div>


    <div class="tool-row">

        <button
            id="calculateBtn"
            class="primary"
        >
            ⛰️ 計算所選範圍坡度
        </button>

    </div>


    <div class="tool-row">

        <button
            id="clearBtn"
            class="danger"
        >
            🗑 清除分析
        </button>

    </div>


    <div class="tool-row">

        <label>
            坡度分析資料
        </label>

        <select id="slopeLayerSelect">

            <option value="none">
                不顯示
            </option>

            <option value="slope7">
                NLSC 20m DTM 坡度圖－7級
            </option>

            <option value="slope30">
                NLSC 20m DTM 坡度圖－30%以上
            </option>

            <option value="aspect">
                NLSC 20m DTM 坡向圖
            </option>

            <option value="contour">
                NLSC 20m DTM 等高線
            </option>

        </select>

    </div>


    <div class="info-box">

        <b>操作方式</b><br>

        ① 點擊「開始繪製分析範圍」<br>
        ② 在地圖上逐點點擊<br>
        ③ 點擊「完成範圍」<br>
        ④ 點擊「計算所選範圍坡度」<br><br>

        底圖：
        <b>NLSC 臺灣通用電子地圖</b>

    </div>

</div>


<!-- =====================================================
     右側分析結果
===================================================== -->

<div id="slopePanel">

    <h3>⛰️ 坡度分析結果</h3>

    <div class="panel-subtitle">
        目前選取範圍
    </div>


    <div class="stat-grid">

        <div class="stat-card">

            <div class="stat-label">
                分析面積
            </div>

            <div
                class="stat-value"
                id="areaValue"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Polygon
            </div>

            <div
                class="stat-value"
                id="polygonValue"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                平均坡度
            </div>

            <div
                class="stat-value"
                id="meanSlope"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                最大坡度
            </div>

            <div
                class="stat-value"
                id="maxSlope"
            >
                —
            </div>

        </div>

    </div>


    <div class="section-title">
        坡度分級
    </div>


    <div id="slopeDistribution">

        <div class="slope-row">

            <span>
                0～5%
            </span>

            <div class="slope-bar">
                <div
                    class="slope-fill s0"
                    id="bar0"
                    style="width:0%"
                ></div>
            </div>

            <strong id="pct0">
                0%
            </strong>

        </div>


        <div class="slope-row">

            <span>
                5～15%
            </span>

            <div class="slope-bar">
                <div
                    class="slope-fill s1"
                    id="bar1"
                    style="width:0%"
                ></div>
            </div>

            <strong id="pct1">
                0%
            </strong>

        </div>


        <div class="slope-row">

            <span>
                15～30%
            </span>

            <div class="slope-bar">
                <div
                    class="slope-fill s2"
                    id="bar2"
                    style="width:0%"
                ></div>
            </div>

            <strong id="pct2">
                0%
            </strong>

        </div>


        <div class="slope-row">

            <span>
                30%以上
            </span>

            <div class="slope-bar">
                <div
                    class="slope-fill s3"
                    id="bar3"
                    style="width:0%"
                ></div>
            </div>

            <strong id="pct3">
                0%
            </strong>

        </div>

    </div>


    <div class="section-title">
        查估參考指標
    </div>


    <div class="stat-card">

        <div class="stat-label">
            15%以上坡度面積比例
        </div>

        <div
            class="stat-value"
            id="steepArea"
        >
            —
        </div>

    </div>


    <div class="note" id="status">

        尚未選取分析範圍。

        <br><br>

        NLSC 底圖已啟用。

    </div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js">
</script>


<script>

"use strict";


/* =====================================================
   NLSC 底圖
===================================================== */

const nlscEMAP =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/EMAP/default/EPSG:3857/{z}/{y}/{x}",
        {
            maxZoom: 19,

            attribution:
                "© 內政部國土測繪中心 NLSC"
        }
    );


/* =====================================================
   NLSC 正射影像
===================================================== */

const nlscPHOTO =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/EPSG:3857/{z}/{y}/{x}",
        {
            maxZoom: 19,

            attribution:
                "© 內政部國土測繪中心 NLSC"
        }
    );


/* =====================================================
   NLSC 等高線
===================================================== */

const nlscContour =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/EMAP5/default/EPSG:3857/{z}/{y}/{x}",
        {
            maxZoom: 19,

            opacity: .75,

            attribution:
                "© 內政部國土測繪中心 NLSC"
        }
    );


/* =====================================================
   地圖
===================================================== */

const map =
    L.map(
        "map",
        {
            center:
                [
                    25.012098,
                    121.465675
                ],

            zoom: 15,

            layers:
                [
                    nlscEMAP
                ],

            zoomControl:
                true
        }
    );


/* =====================================================
   NLSC DTM 坡度相關圖層
===================================================== */

/*
   注意：

   以下服務是 NLSC 圖資服務雲所發布的
   20m DTM 加值成果。

   它們是「圖磚成果」，可以用來視覺檢核
   坡度位置。

   真正的 Polygon 數值統計仍應使用
   DTM 分析 API 或 DEM 原始格網。
*/


const nlscSlope7 =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/SLOPE7/default/EPSG:3857/{z}/{y}/{x}",
        {
            maxZoom: 19,

            opacity: .65,

            attribution:
                "© 內政部國土測繪中心 NLSC"
        }
    );


const nlscSlope30 =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/SLOPE30/default/EPSG:3857/{z}/{y}/{x}",
        {
            maxZoom: 19,

            opacity: .65,

            attribution:
                "© 內政部國土測繪中心 NLSC"
        }
    );


const nlscAspect =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/ASPECT/default/EPSG:3857/{z}/{y}/{x}",
        {
            maxZoom: 19,

            opacity: .65,

            attribution:
                "© 內政部國土測繪中心 NLSC"
        }
    );


/* =====================================================
   圖層控制
===================================================== */

const baseLayers = {

    "NLSC 臺灣通用電子地圖":
        nlscEMAP,

    "NLSC 正射影像":
        nlscPHOTO

};


const overlayLayers = {

    "NLSC 等高線":
        nlscContour,

    "NLSC DTM 坡度－7級":
        nlscSlope7,

    "NLSC DTM 坡度－30%以上":
        nlscSlope30,

    "NLSC DTM 坡向":
        nlscAspect

};


L.control.layers(
    baseLayers,
    overlayLayers,
    {
        collapsed: true,
        position: "topright"
    }
).addTo(map);


/* =====================================================
   比例尺
===================================================== */

L.control.scale(
    {
        imperial: false,
        position: "bottomleft"
    }
).addTo(map);


/* =====================================================
   Polygon 狀態
===================================================== */

let drawing = false;

let drawPoints = [];

let tempLine = null;

let analysisPolygon = null;

let polygonLayer = null;


/* =====================================================
   開始繪製
===================================================== */

document
    .getElementById("drawBtn")
    .addEventListener(
        "click",
        function() {

            drawing = true;

            drawPoints = [];

            if (tempLine) {

                map.removeLayer(tempLine);

                tempLine = null;

            }

            if (polygonLayer) {

                map.removeLayer(polygonLayer);

                polygonLayer = null;

            }

            analysisPolygon = null;

            document
                .getElementById("status")
                .innerHTML =
                "繪製模式已啟用。<br>" +
                "請在地圖上依序點擊 Polygon 頂點。";

        }
    );


/* =====================================================
   地圖點擊
===================================================== */

map.on(
    "click",
    function(e) {

        if (!drawing) {

            return;

        }

        drawPoints.push(
            [
                e.latlng.lat,
                e.latlng.lng
            ]
        );


        if (tempLine) {

            map.removeLayer(tempLine);

        }


        tempLine =
            L.polyline(
                drawPoints,
                {
                    color: "#2563eb",

                    weight: 3,

                    dashArray: "7 5"
                }
            ).addTo(map);

    }
);


/* =====================================================
   完成 Polygon
===================================================== */

document
    .getElementById("finishBtn")
    .addEventListener(
        "click",
        function() {

            if (drawPoints.length < 3) {

                alert(
                    "至少需要 3 個點才能形成分析範圍。"
                );

                return;

            }


            drawing = false;


            if (tempLine) {

                map.removeLayer(tempLine);

                tempLine = null;

            }


            analysisPolygon =
                L.polygon(
                    drawPoints,
                    {
                        className:
                            "analysis-polygon",

                        color:
                            "#dc2626",

                        weight:
                            3,

                        fillColor:
                            "#facc15",

                        fillOpacity:
                            .12
                    }
                ).addTo(map);


            polygonLayer =
                analysisPolygon;


            map.fitBounds(
                analysisPolygon.getBounds(),
                {
                    padding:
                        [30, 30]
                }
            );


            const area =
                calculateLeafletPolygonArea(
                    drawPoints
                );


            document
                .getElementById("areaValue")
                .textContent =
                formatArea(area);


            document
                .getElementById("polygonValue")
                .textContent =
                "1";


            document
                .getElementById("status")
                .innerHTML =
                "分析範圍已完成。<br>" +
                "請按「計算所選範圍坡度」。";

        }
    );


/* =====================================================
   計算 Polygon 面積
===================================================== */

function calculateLeafletPolygonArea(
    latlngs
) {

    const coordinates =
        latlngs.map(
            p => [
                p[1],
                p[0]
            ]
        );


    coordinates.push(
        coordinates[0]
    );


    const polygon =
        turf.polygon(
            [coordinates]
        );


    return turf.area(
        polygon
    );

}


/* =====================================================
   面積格式
===================================================== */

function formatArea(
    area
) {

    if (area < 10000) {

        return (
            area.toFixed(1) +
            " m²"
        );

    }


    return (
        (area / 10000)
            .toFixed(2) +
        " 公頃"
    );

}


/* =====================================================
   坡度圖層切換
===================================================== */

document
    .getElementById("slopeLayerSelect")
    .addEventListener(
        "change",
        function() {

            nlscSlope7.removeFrom(map);

            nlscSlope30.removeFrom(map);

            nlscAspect.removeFrom(map);

            nlscContour.removeFrom(map);


            switch (
                this.value
            ) {

                case "slope7":

                    nlscSlope7.addTo(map);

                    break;


                case "slope30":

                    nlscSlope30.addTo(map);

                    break;


                case "aspect":

                    nlscAspect.addTo(map);

                    break;


                case "contour":

                    nlscContour.addTo(map);

                    break;

            }

        }
    );


/* =====================================================
   坡度分析
===================================================== */

document
    .getElementById("calculateBtn")
    .addEventListener(
        "click",
        function() {

            if (!analysisPolygon) {

                alert(
                    "請先繪製並完成分析範圍。"
                );

                return;

            }


            const area =
                calculateLeafletPolygonArea(
                    drawPoints
                );


            document
                .getElementById("areaValue")
                .textContent =
                formatArea(area);


            /*
             * ------------------------------------------------
             * V1：
             * 先使用 NLSC DTM 坡度圖作為視覺檢核。
             *
             * 不把 WMTS JPG 當成 DEM 數值。
             *
             * 因此下面不虛構平均坡度。
             * ------------------------------------------------
             */


            document
                .getElementById("meanSlope")
                .textContent =
                "待 DTM API";


            document
                .getElementById("maxSlope")
                .textContent =
                "待 DTM API";


            document
                .getElementById("steepArea")
                .textContent =
                "待 DTM API";


            document
                .getElementById("status")
                .innerHTML =
                "<b>範圍分析已建立</b><br><br>" +

                "面積：" +
                formatArea(area) +
                "<br><br>" +

                "目前已套用 NLSC DTM 坡度成果作為視覺檢核。<br><br>" +

                "平均坡度、最大坡度及「15%以上坡度面積比例」" +
                "下一階段應直接接 NLSC DTM 分析服務取得數值，" +
                "避免把坡度圖磚影像誤當成 DEM 高程資料。";

        }
    );


/* =====================================================
   清除
===================================================== */

document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        function() {

            drawing = false;

            drawPoints = [];


            if (tempLine) {

                map.removeLayer(tempLine);

                tempLine = null;

            }


            if (polygonLayer) {

                map.removeLayer(
                    polygonLayer
                );

                polygonLayer = null;

            }


            analysisPolygon = null;


            document
                .getElementById("areaValue")
                .textContent =
                "—";


            document
                .getElementById("polygonValue")
                .textContent =
                "0";


            document
                .getElementById("meanSlope")
                .textContent =
                "—";


            document
                .getElementById("maxSlope")
                .textContent =
                "—";


            document
                .getElementById("steepArea")
                .textContent =
                "—";


            for (
                let i = 0;
                i < 4;
                i++
            ) {

                document
                    .getElementById(
                        "bar" + i
                    )
                    .style.width =
                    "0%";


                document
                    .getElementById(
                        "pct" + i
                    )
                    .textContent =
                    "0%";

            }


            document
                .getElementById("status")
                .innerHTML =
                "分析範圍已清除。";

        }
    );


</script>

</body>
</html>
