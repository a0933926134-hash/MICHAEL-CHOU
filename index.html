<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>NLSC URBAN 新北市都市計畫圖測試</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

}

#map {

    width: 100%;
    height: 100vh;

}

#panel {

    position: absolute;

    z-index: 9999;

    top: 10px;
    left: 50px;

    width: 380px;

    padding: 15px;

    background: rgba(255,255,255,0.97);

    border-radius: 8px;

    box-shadow:
        0 2px 12px rgba(0,0,0,0.25);

    font-family:
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    font-size: 14px;

    line-height: 1.6;

}

#panel h3 {

    margin: 0 0 10px 0;

}

#status {

    margin-top: 10px;

    padding: 10px;

    background: #f3f4f6;

    border-radius: 5px;

    word-break: break-all;

    font-size: 12px;

}

button {

    margin-top: 6px;

    padding: 7px 12px;

    border: 1px solid #aaa;

    border-radius: 4px;

    background: white;

    cursor: pointer;

}

button:hover {

    background: #eee;

}

</style>

</head>

<body>

<div id="map"></div>

<div id="panel">

```
<h3>
    🗺️ 新北市都市計畫圖
</h3>

<div>
    NLSC WMTS：
    <b>URBAN</b>
</div>

<div>
    TileMatrixSet：
    <b>EPSG:3857</b>
</div>

<hr>

<button onclick="showUrban()">
    顯示 URBAN
</button>

<button onclick="hideUrban()">
    隱藏 URBAN
</button>

<button onclick="zoomTest()">
    測試 Z13
</button>

<div id="status">
    等待測試...
</div>
```

</div>

<script>

/* ============================================================
   新北市中心
   ============================================================ */

const NEW_TAIPEI_CENTER = [
    25.012098,
    121.465675
];


/* ============================================================
   建立 Leaflet
   ============================================================ */

const map = L.map("map", {

    center: NEW_TAIPEI_CENTER,

    zoom: 13,

    minZoom: 0,

    maxZoom: 19

});


/* ============================================================
   NLSC EMAP
   ============================================================ */

const nlscEMAP = L.tileLayer(

    "https://wmts.nlsc.gov.tw/wmts/" +
    "EMAP/default/EPSG:3857/" +
    "{z}/{y}/{x}",

    {

        attribution:
            "© 內政部國土測繪中心 NLSC",

        tileSize: 256,

        minZoom: 0,

        maxZoom: 19,

        opacity: 1,

        crossOrigin: true

    }

);


/* ============================================================
   NLSC URBAN
   ============================================================ */

const nlscURBAN = L.tileLayer(

    "https://wmts.nlsc.gov.tw/wmts/" +
    "URBAN/default/EPSG:3857/" +
    "{z}/{y}/{x}",

    {

        attribution:
            "© 內政部國土測繪中心－都市計畫使用分區圖",

        tileSize: 256,

        minZoom: 0,

        maxZoom: 19,

        opacity: 1,

        crossOrigin: true

    }

);


/* ============================================================
   加入底圖
   ============================================================ */

nlscEMAP.addTo(map);


/* ============================================================
   加入 URBAN
   ============================================================ */

nlscURBAN.addTo(map);


/* ============================================================
   Tile 載入成功
   ============================================================ */

nlscURBAN.on(

    "tileload",

    function(e) {

        console.log(
            "================================"
        );

        console.log(
            "URBAN TILE LOAD OK"
        );

        console.log(
            e.tile.src
        );

        console.log(
            "================================"
        );

        document.getElementById(
            "status"
        ).innerHTML =

            "✅ URBAN Tile 載入成功<br><br>" +

            e.tile.src;

    }

);


/* ============================================================
   Tile 載入失敗
   ============================================================ */

nlscURBAN.on(

    "tileerror",

    function(e) {

        console.error(
            "================================"
        );

        console.error(
            "URBAN TILE ERROR"
        );

        console.error(
            e.tile
        );

        console.error(
            e.tile?.src
        );

        console.error(
            "================================"
        );

        document.getElementById(
            "status"
        ).innerHTML =

            "❌ URBAN Tile 載入失敗<br><br>" +

            (
                e.tile?.src ||
                "沒有取得 URL"
            );

    }

);


/* ============================================================
   顯示 URBAN
   ============================================================ */

function showUrban() {

    if (!map.hasLayer(nlscURBAN)) {

        nlscURBAN.addTo(map);

    }

    document.getElementById(
        "status"
    ).innerHTML =

        "URBAN 已顯示，等待 Tile...";

}


/* ============================================================
   隱藏 URBAN
   ============================================================ */

function hideUrban() {

    if (map.hasLayer(nlscURBAN)) {

        map.removeLayer(nlscURBAN);

    }

    document.getElementById(
        "status"
    ).innerHTML =

        "URBAN 已隱藏";

}


/* ============================================================
   測試 Z13
   ============================================================ */

function zoomTest() {

    map.setView(

        NEW_TAIPEI_CENTER,

        13

    );

    setTimeout(

        function() {

            const center =
                map.getCenter();

            const zoom =
                map.getZoom();

            const point =
                map.project(
                    center,
                    zoom
                );

            const tileX =
                Math.floor(
                    point.x / 256
                );

            const tileY =
                Math.floor(
                    point.y / 256
                );


            const testURL =

                "https://wmts.nlsc.gov.tw/wmts/" +

                "URBAN/default/EPSG:3857/" +

                zoom +
                "/" +
                tileY +
                "/" +
                tileX;


            console.log(
                "Leaflet 計算 Tile："
            );

            console.log(
                "Z =",
                zoom
            );

            console.log(
                "X =",
                tileX
            );

            console.log(
                "Y =",
                tileY
            );

            console.log(
                "URL =",
                testURL
            );


            document.getElementById(
                "status"
            ).innerHTML =

                "<b>目前 Z13 Tile</b><br><br>" +

                "Z = " +
                zoom +
                "<br>" +

                "X = " +
                tileX +
                "<br>" +

                "Y = " +
                tileY +
                "<br><br>" +

                testURL;

        },

        500

    );

}


/* ============================================================
   Layer Control
   ============================================================ */

L.control.layers(

    {

        "NLSC 電子地圖":
            nlscEMAP

    },

    {

        "都市計畫使用分區 URBAN":
            nlscURBAN

    },

    {

        collapsed: false

    }

).addTo(map);


/* ============================================================
   Scale
   ============================================================ */

L.control.scale({

    imperial: false,

    metric: true

}).addTo(map);


/* ============================================================
   Zoom 改變時顯示 Tile
   ============================================================ */

map.on(

    "zoomend",

    function() {

        console.log(
            "目前 Zoom：",
            map.getZoom()
        );

    }

);


/* ============================================================
   初始測試
   ============================================================ */

console.log(
    "NLSC URBAN initialized."
);

console.log(
    "URL template:"
);

console.log(
    "https://wmts.nlsc.gov.tw/wmts/" +
    "URBAN/default/EPSG:3857/{z}/{y}/{x}"
);

</script>

</body>

</html>
