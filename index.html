<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OpenStreetMap 社區資料擷取系統</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    background: #f5f6f8;
}

header {

    background: #1f4e78;
    color: white;

    padding: 15px 20px;

    font-size: 22px;
    font-weight: bold;

}

#container {

    display: flex;

    height: calc(100vh - 58px);

}

#panel {

    width: 380px;

    background: white;

    padding: 15px;

    overflow-y: auto;

    border-right:
        1px solid #ccc;

}

#map {

    flex: 1;

}

label {

    display: block;

    margin-top: 12px;

    margin-bottom: 5px;

    font-weight: bold;

}

input {

    width: 100%;

    padding: 9px;

    border:
        1px solid #ccc;

    border-radius: 5px;

}

button {

    width: 100%;

    padding: 10px;

    margin-top: 12px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    font-size: 15px;

}

#searchBtn {

    background: #1976d2;

    color: white;

}

#exportBtn {

    background: #2e7d32;

    color: white;

}

button:hover {

    opacity: 0.85;

}

#status {

    margin-top: 15px;

    padding: 10px;

    background: #f1f3f5;

    border-radius: 5px;

    font-size: 14px;

}

table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 10px;

    font-size: 12px;

}

th,
td {

    border:
        1px solid #ddd;

    padding: 6px;

    text-align: left;

}

th {

    background: #eeeeee;

}

#resultArea {

    margin-top: 15px;

    overflow-x: auto;

}

.infoBox {

    margin-top: 15px;

    padding: 12px;

    background: #fff8e1;

    border-left:
        4px solid #ff9800;

    font-size: 13px;

    line-height: 1.6;

}

</style>
</head>

<body>

<header>
    🏢 OpenStreetMap 社區資料擷取系統
</header>

<div id="container">

    <!-- ========================= -->
    <!-- 左側控制面板 -->
    <!-- ========================= -->

    <div id="panel">

        <label>
            WGS84 緯度 Latitude
        </label>

        <input
            id="lat"
            type="number"
            step="any"
            value="25.012098"
        >

        <label>
            WGS84 經度 Longitude
        </label>

        <input
            id="lon"
            type="number"
            step="any"
            value="121.465675"
        >

        <label>
            搜尋半徑（公尺）
        </label>

        <input
            id="radius"
            type="number"
            value="1000"
        >

        <button
            id="searchBtn"
            onclick="searchCommunities()"
        >
            🔍 查詢 OSM 社區資料
        </button>

        <button
            id="exportBtn"
            onclick="exportCSV()"
        >
            📥 匯出 CSV
        </button>

        <div id="status">
            尚未查詢
        </div>

        <div class="infoBox">

            <b>資料來源說明</b><br>

            本系統僅擷取 OpenStreetMap 已存在的 Tags。<br>

            若 OSM 未填寫：
            建築完成日期、戶數、樓層或高度，
            則會顯示空白。

        </div>

        <div id="resultArea"></div>

    </div>

    <!-- ========================= -->
    <!-- 地圖 -->
    <!-- ========================= -->

    <div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   Global Variables
========================================================= */

let map;

let resultLayer;

let communityData = [];


/* =========================================================
   Initialize Map
========================================================= */

function initMap() {

    map = L.map("map").setView(
        [25.012098, 121.465675],
        14
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    resultLayer = L.layerGroup().addTo(map);

}


initMap();


/* =========================================================
   Search Communities
========================================================= */

async function searchCommunities() {

    const lat =
        parseFloat(
            document.getElementById("lat").value
        );

    const lon =
        parseFloat(
            document.getElementById("lon").value
        );

    const radius =
        parseFloat(
            document.getElementById("radius").value
        );


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(radius)
    ) {

        alert("請輸入正確的座標與搜尋半徑");

        return;

    }


    document.getElementById("status").innerHTML =
        "⏳ 正在從 OpenStreetMap 查詢資料...";


    resultLayer.clearLayers();

    communityData = [];


    /* =====================================================
       Overpass Query

       查詢：

       1. 公寓大樓
       2. 住宅建築
       3. 有名稱的建築
       4. 多邊形建築物
    ===================================================== */

    const query = `

[out:json][timeout:60];

(

    way
        ["building"="apartments"]
        (around:${radius},${lat},${lon});

    way
        ["building"="residential"]
        (around:${radius},${lat},${lon});

    way
        ["building"="yes"]
        ["name"]
        (around:${radius},${lat},${lon});

    relation
        ["building"]
        ["name"]
        (around:${radius},${lat},${lon});

);

out center tags;

`;


    try {

        const response =
            await fetch(
                "https://overpass-api.de/api/interpreter",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        "data=" +
                        encodeURIComponent(query)
                }
            );


        if (!response.ok) {

            throw new Error(
                `Overpass HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(data.elements)
        ) {

            throw new Error(
                "Overpass 回傳格式異常"
            );

        }


        /* =================================================
           Process Data
        ================================================= */

        for (
            const item of data.elements
        ) {

            const tags =
                item.tags || {};


            /* =============================================
               Get Coordinate
            ============================================= */

            let itemLat = null;

            let itemLon = null;


            if (
                item.type === "node"
            ) {

                itemLat = item.lat;

                itemLon = item.lon;

            }


            else if (
                item.center
            ) {

                itemLat = item.center.lat;

                itemLon = item.center.lon;

            }


            if (
                !Number.isFinite(itemLat) ||
                !Number.isFinite(itemLon)
            ) {

                continue;

            }


            /* =============================================
               Community / Committee Name

               優先順序：

               1. 管委會相關名稱
               2. operator
               3. name
            ============================================= */


            const committeeName =
                tags["management:name"] ||
                tags["committee:name"] ||
                tags["operator"] ||
                tags["name"] ||
                "";


            const communityName =
                tags["name"] ||
                tags["name:zh"] ||
                committeeName ||
                "";


            /* =============================================
               Completion Date
            ============================================= */

            const completionDate =

                tags["construction_date"] ||

                tags["start_date"] ||

                tags["building:construction_date"] ||

                "";


            /* =============================================
               Total Households
            ============================================= */

            const households =

                tags["building:flats"] ||

                tags["flats"] ||

                tags["addr:flats"] ||

                "";


            /* =============================================
               Floors
            ============================================= */

            const levels =

                tags["building:levels"] ||

                tags["levels"] ||

                "";


            /* =============================================
               Height
            ============================================= */

            const height =

                tags["height"] ||

                tags["building:height"] ||

                "";


            /* =============================================
               Building Use
            ============================================= */

            const buildingUse =

                tags["building:use"] ||

                tags["use"] ||

                tags["building"] ||

                "";


            /* =============================================
               WGS84 → TWD97
            ============================================= */

            const twd97 =
                wgs84ToTwd97(
                    itemLat,
                    itemLon
                );


            /* =============================================
               Build Object
            ============================================= */

            const community = {

                committeeName,

                communityName,

                completionDate,

                households,

                levels,

                height,

                buildingUse,

                latitude:
                    itemLat,

                longitude:
                    itemLon,

                twd97X:
                    twd97.x,

                twd97Y:
                    twd97.y,

                osmType:
                    item.type,

                osmId:
                    item.id

            };


            communityData.push(
                community
            );


            /* =============================================
               Add Marker
            ============================================= */

            const popupHTML = `

<b>🏢 社區名稱</b><br>
${communityName || "未提供"}

<hr>

<b>🏛️ 管委會名稱</b><br>
${committeeName || "未提供"}

<br><br>

<b>📅 建築完成日期：</b>
${completionDate || "未提供"}

<br>

<b>👨‍👩‍👧‍👦 總戶數：</b>
${households || "未提供"}

<br>

<b>🏢 樓層數：</b>
${levels || "未提供"}

<br>

<b>📏 建築高度：</b>
${height || "未提供"}

<br>

<b>🏠 建物用途：</b>
${buildingUse || "未提供"}

<hr>

<b>🌐 WGS84</b><br>

Lat：
${itemLat.toFixed(6)}

<br>

Lon：
${itemLon.toFixed(6)}

<br><br>

<b>📐 TWD97 TM2</b><br>

X：
${twd97.x.toFixed(2)}

<br>

Y：
${twd97.y.toFixed(2)}

`;

            L.marker(
                [itemLat, itemLon]
            )

            .bindPopup(
                popupHTML
            )

            .addTo(
                resultLayer
            );

        }


        /* =================================================
           Remove Duplicate
        ================================================= */

        communityData =
            removeDuplicates(
                communityData
            );


        /* =================================================
           Display Result
        ================================================= */

        displayResults();


        /* =================================================
           Status
        ================================================= */

        document.getElementById(
            "status"
        ).innerHTML =

            `✅ 查詢完成<br>
             共取得
             <b>${communityData.length}</b>
             筆資料`;


        /* =================================================
           Move Map
        ================================================= */

        map.setView(
            [lat, lon],
            15
        );


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "status"
        ).innerHTML =

            `❌ 查詢失敗：${error.message}`;

    }

}


/* =========================================================
   Remove Duplicate
========================================================= */

function removeDuplicates(data) {

    const mapData = new Map();


    for (
        const item of data
    ) {

        const key =

            `${item.osmType}_${item.osmId}`;


        if (
            !mapData.has(key)
        ) {

            mapData.set(
                key,
                item
            );

        }

    }


    return Array.from(
        mapData.values()
    );

}


/* =========================================================
   Display Result Table
========================================================= */

function displayResults() {

    const resultArea =
        document.getElementById(
            "resultArea"
        );


    if (
        communityData.length === 0
    ) {

        resultArea.innerHTML =
            "<p>沒有查到資料</p>";

        return;

    }


    let html = `

<table>

<thead>

<tr>

<th>社區名稱</th>

<th>完成日期</th>

<th>戶數</th>

<th>樓層</th>

<th>用途</th>

</tr>

</thead>

<tbody>

`;


    for (
        const item of communityData
    ) {

        html += `

<tr>

<td>
${escapeHTML(item.communityName)}
</td>

<td>
${escapeHTML(item.completionDate)}
</td>

<td>
${escapeHTML(item.households)}
</td>

<td>
${escapeHTML(item.levels)}
</td>

<td>
${escapeHTML(item.buildingUse)}
</td>

</tr>

`;

    }


    html += `

</tbody>

</table>

`;


    resultArea.innerHTML =
        html;

}


/* =========================================================
   Escape HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value || ""
    )

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   WGS84 → TWD97 TM2

   Taiwan TM2 Zone 121
========================================================= */

function wgs84ToTwd97(lat, lon) {

    const DEG_TO_RAD =
        Math.PI / 180;


    /* =============================================
       Ellipsoid
    ============================================= */

    const a =
        6378137.0;

    const b =
        6356752.314245;


    /* =============================================
       TM Parameters
    ============================================= */

    const lon0 =
        121 * DEG_TO_RAD;

    const k0 =
        0.9999;

    const dx =
        250000;

    const dy =
        0;


    const e =
        Math.sqrt(
            1 -
            (b * b) /
            (a * a)
        );


    const e2 =
        (e * e) /
        (1 - e * e);


    const latRad =
        lat * DEG_TO_RAD;

    const lonRad =
        lon * DEG_TO_RAD;


    const N =

        a /
        Math.sqrt(
            1 -
            Math.pow(
                e *
                Math.sin(latRad),
                2
            )
        );


    const T =
        Math.pow(
            Math.tan(latRad),
            2
        );


    const C =

        e2 *
        Math.pow(
            Math.cos(latRad),
            2
        );


    const A =

        Math.cos(latRad) *
        (
            lonRad -
            lon0
        );


    const M =

        a *

        (
            (1 -
                Math.pow(e, 2) / 4 -
                3 * Math.pow(e, 4) / 64 -
                5 * Math.pow(e, 6) / 256
            ) * latRad

            -

            (
                3 * Math.pow(e, 2) / 8 +
                3 * Math.pow(e, 4) / 32 +
                45 * Math.pow(e, 6) / 1024
            )
            *
            Math.sin(2 * latRad)

            +

            (
                15 * Math.pow(e, 4) / 256 +
                45 * Math.pow(e, 6) / 1024
            )
            *
            Math.sin(4 * latRad)

            -

            (
                35 * Math.pow(e, 6) / 3072
            )
            *
            Math.sin(6 * latRad)

        );


    const x =

        dx +

        k0 *

        N *

        (

            A

            +

            (1 - T + C) *
            Math.pow(A, 3) /
            6

            +

            (
                5 -
                18 * T +
                T * T +
                72 * C -
                58 * e2
            )
            *
            Math.pow(A, 5) /
            120

        );


    const y =

        dy +

        k0 *

        (

            M

            +

            N *

            Math.tan(latRad)

            *

            (

                Math.pow(A, 2) /
                2

                +

                (
                    5 -
                    T +
                    9 * C +
                    4 * C * C
                )
                *
                Math.pow(A, 4) /
                24

                +

                (
                    61 -
                    58 * T +
                    T * T +
                    600 * C -
                    330 * e2
                )
                *
                Math.pow(A, 6) /
                720

            )

        );


    return {

        x,

        y

    };

}


/* =========================================================
   Export CSV
========================================================= */

function exportCSV() {

    if (
        !communityData.length
    ) {

        alert(
            "目前沒有資料可以匯出"
        );

        return;

    }


    const headers = [

        "社區名稱",

        "管理委員會名稱",

        "建築完成日期",

        "總戶數",

        "樓層數",

        "建築高度",

        "建物用途",

        "WGS84緯度",

        "WGS84經度",

        "TWD97_X",

        "TWD97_Y",

        "OSM類型",

        "OSM_ID"

    ];


    const rows =
        communityData.map(
            item => [

                item.communityName,

                item.committeeName,

                item.completionDate,

                item.households,

                item.levels,

                item.height,

                item.buildingUse,

                item.latitude,

                item.longitude,

                item.twd97X,

                item.twd97Y,

                item.osmType,

                item.osmId

            ]
        );


    const csv = [

        headers.join(","),

        ...rows.map(
            row =>

                row.map(
                    value =>

                        `"${String(
                            value ?? ""
                        ).replace(
                            /"/g,
                            '""'
                        )}"`
                )

                .join(",")

        )

    ].join("\n");


    const blob =

        new Blob(

            ["\uFEFF" + csv],

            {
                type:
                    "text/csv;charset=utf-8;"
            }

        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        "OSM_社區資料.csv";


    document.body.appendChild(a);


    a.click();


    document.body.removeChild(a);


    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
