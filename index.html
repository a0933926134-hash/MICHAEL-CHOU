<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NLSC DTM 20m 坡度分析</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

/* ================================
   控制面板
================================ */
#panel {
    position: absolute;
    z-index: 1000;
    top: 12px;
    right: 12px;

    width: 360px;
    max-height: calc(100vh - 24px);

    overflow-y: auto;

    padding: 16px;

    background:
        linear-gradient(
            135deg,
            #fffdf5,
            #fef3c7
        );

    border: 1px solid #fcd34d;
    border-radius: 16px;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.18);

    box-sizing: border-box;
}

#panel h2 {
    margin: 0 0 10px 0;
    font-size: 20px;
    color: #78350f;
}

#panel h3 {
    margin:
        14px 0 8px 0;

    font-size: 15px;
    color: #92400e;
}

.control-row {
    margin-bottom: 10px;
}

.control-row label {
    display: block;
    margin-bottom: 4px;

    font-size: 13px;
    font-weight: 600;
}

select,
button {
    width: 100%;
    box-sizing: border-box;

    padding: 8px 10px;

    border-radius: 8px;
    border: 1px solid #d1d5db;

    background: white;

    font-size: 14px;
}

button {
    cursor: pointer;
    font-weight: 700;
}

button:hover {
    filter: brightness(0.97);
}

.btn-primary {
    background: #92400e;
    color: white;
    border-color: #78350f;
}

.btn-secondary {
    background: white;
    color: #78350f;
}

.btn-danger {
    background: #991b1b;
    color: white;
    border-color: #7f1d1d;
}

/* ================================
   狀態
================================ */
#status {
    margin-top: 10px;

    padding: 9px;

    border-radius: 8px;

    background: #fef3c7;
    border: 1px solid #f59e0b;

    color: #78350f;

    font-size: 13px;
    line-height: 1.5;
}

#status.success {
    background: #ecfdf5;
    border-color: #34d399;
    color: #065f46;
}

#status.error {
    background: #fef2f2;
    border-color: #f87171;
    color: #991b1b;
}

/* ================================
   統計表
================================ */
.stats-table {
    width: 100%;
    border-collapse: collapse;

    background: white;

    border-radius: 8px;
    overflow: hidden;

    font-size: 13px;
}

.stats-table td {
    padding: 6px 8px;

    border-bottom:
        1px solid #e5e7eb;
}

.stats-table td:first-child {
    font-weight: 600;
    color: #374151;
}

.stats-table td:last-child {
    text-align: right;
    font-weight: 700;
}

/* ================================
   坡度分級
================================ */
.slope-bar {
    display: flex;

    width: 100%;
    height: 22px;

    margin-top: 8px;

    border-radius: 5px;

    overflow: hidden;

    border: 1px solid #d1d5db;
}

.slope-segment {
    height: 100%;
}

.legend {
    margin-top: 8px;
}

.legend-row {
    display: flex;
    align-items: center;

    margin: 4px 0;

    font-size: 12px;
}

.legend-color {
    width: 18px;
    height: 14px;

    margin-right: 6px;

    border-radius: 3px;
}

/* ================================
   DTM 說明
================================ */
.note {
    margin-top: 8px;

    font-size: 11px;
    line-height: 1.5;

    color: #6b7280;
}

.value-highlight {
    color: #b45309;
    font-size: 16px;
}

/* ================================
   Leaflet tooltip
================================ */
.slope-label {
    background: white;
    border: 1px solid #9ca3af;
    color: #111827;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">

    <h2>⛰️ NLSC DTM 20m 坡度分析</h2>

    <div class="control-row">
        <label for="demSelect">
            DTM 數值資料
        </label>

        <select id="demSelect">

            <option value="TW_DLA_20100101_20191101_20M_3826_DEM">
                20m DEM（2010–2019）
            </option>

            <option value="TW_DLA_20110101_20161101_20M_3826_DEM">
                20m DEM（2011–2016）
            </option>

            <option value="TW_DLA_20010814_20061226_20M_3826_DEM">
                20m DEM（2001–2006）
            </option>

        </select>
    </div>


    <h3>① 選擇分析範圍</h3>

    <button
        id="drawBtn"
        class="btn-primary"
        onclick="startDrawing()"
    >
        ✏️ 開始繪製範圍
    </button>

    <div style="height:6px"></div>

    <button
        class="btn-secondary"
        onclick="clearPolygon()"
    >
        🗑️ 清除範圍
    </button>


    <h3>② DTM 坡度分析</h3>

    <button
        id="analyzeBtn"
        class="btn-primary"
        onclick="analyzeSlope()"
    >
        ⛰️ 開始計算坡度
    </button>


    <div id="status">
        請先在地圖上繪製一個 Polygon。
    </div>


    <h3>③ 範圍資訊</h3>

    <table class="stats-table">

        <tr>
            <td>範圍面積</td>
            <td id="polygonArea">—</td>
        </tr>

        <tr>
            <td>DTM 有效分析面積</td>
            <td id="dtmArea">—</td>
        </tr>

    </table>


    <h3>④ 坡度統計</h3>

    <table class="stats-table">

        <tr>
            <td>平均坡度</td>
            <td id="avgSlope">—</td>
        </tr>

        <tr>
            <td>平均坡度</td>
            <td id="avgSlopeDegree">—</td>
        </tr>

        <tr>
            <td>最小坡度</td>
            <td id="minSlope">—</td>
        </tr>

        <tr>
            <td>最大坡度</td>
            <td id="maxSlope">—</td>
        </tr>

        <tr>
            <td>
                <strong>＞15% 面積比例</strong>
            </td>

            <td
                id="over15"
                class="value-highlight"
            >
                —
            </td>
        </tr>

    </table>


    <h3>⑤ 坡度分布</h3>

    <div
        id="slopeDistribution"
        style="
            color:#6b7280;
            font-size:13px;
        "
    >
        尚未分析
    </div>


    <div class="note">

        資料來源：內政部地政司數值地形模型加值應用服務。
        本工具使用 20 公尺 DEM 進行坡度分析。
        坡度計算對象為地形，不包含建物。

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>


<script>

/* ============================================================
   基本設定
============================================================ */

const MAP_CENTER = [25.012098, 121.465675];

const DTM_API =
    "https://dtm-openapi.colife.org.tw";


/*
 * 20m DEM。
 *
 * 依官方 API 文件：
 * 20m 資料屬開放資料，不需要 API Key。
 */
const API_KEY = "";


/* ============================================================
   建立 Leaflet 地圖
============================================================ */

const map = L.map("map", {

    center: MAP_CENTER,

    zoom: 15,

    zoomControl: true

});


/* ============================================================
   NLSC EMAP
============================================================ */

const nlscEmap = L.tileLayer(
    "https://wmts.nlsc.gov.tw/wmts/EMAP/default/EPSG:3857/{z}/{y}/{x}",
    {
        maxZoom: 19,

        attribution:
            "© 內政部國土測繪中心 NLSC"
    }
);


/* ============================================================
   NLSC PHOTO2
============================================================ */

const nlscPhoto = L.tileLayer(
    "https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/EPSG:3857/{z}/{y}/{x}",
    {
        maxZoom: 19,

        attribution:
            "© 內政部國土測繪中心 NLSC"
    }
);


/* ============================================================
   OSM
============================================================ */

const osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            "© OpenStreetMap contributors"
    }
);


/* 預設 NLSC */

nlscEmap.addTo(map);


/* ============================================================
   底圖切換
============================================================ */

L.control.layers(

    {
        "NLSC EMAP": nlscEmap,
        "NLSC PHOTO2": nlscPhoto,
        "OpenStreetMap": osm
    },

    null,

    {
        collapsed: true
    }

).addTo(map);


/* ============================================================
   Polygon
============================================================ */

let polygon = null;

let drawing = false;

let drawingPoints = [];

let drawingLine = null;

let vertexMarkers = [];


/* ============================================================
   開始繪製
============================================================ */

function startDrawing() {

    clearDrawingOnly();

    drawing = true;

    drawingPoints = [];

    setStatus(
        "請依序點擊地圖建立範圍，最後再點擊第一個點完成 Polygon。",
        "normal"
    );

}


/* ============================================================
   地圖點擊
============================================================ */

map.on("click", function(e) {

    if (!drawing) {

        return;

    }


    const point = [
        e.latlng.lat,
        e.latlng.lng
    ];


    /*
     * 如果已經有至少 3 個點，
     * 點擊第一點附近則完成。
     */

    if (
        drawingPoints.length >= 3
    ) {

        const first =
            drawingPoints[0];

        const distance =
            map.distance(
                e.latlng,
                L.latLng(
                    first[0],
                    first[1]
                )
            );


        if (distance <= 20) {

            finishDrawing();

            return;

        }

    }


    drawingPoints.push(point);


    const marker =
        L.circleMarker(
            e.latlng,
            {
                radius: 5,

                color: "#92400e",

                fillColor: "#f59e0b",

                fillOpacity: 1
            }
        ).addTo(map);


    vertexMarkers.push(marker);


    redrawDrawingLine();

});


/* ============================================================
   繪製線
============================================================ */

function redrawDrawingLine() {

    if (drawingLine) {

        map.removeLayer(drawingLine);

    }


    if (
        drawingPoints.length < 2
    ) {

        return;

    }


    drawingLine =
        L.polyline(
            drawingPoints,
            {
                color: "#92400e",

                weight: 3,

                dashArray: "8,6"
            }
        ).addTo(map);

}


/* ============================================================
   完成 Polygon
============================================================ */

function finishDrawing() {

    if (
        drawingPoints.length < 3
    ) {

        alert(
            "至少需要 3 個點才能形成 Polygon。"
        );

        return;

    }


    drawing = false;


    if (drawingLine) {

        map.removeLayer(
            drawingLine
        );

        drawingLine = null;

    }


    vertexMarkers.forEach(
        marker => {

            map.removeLayer(
                marker
            );

        }
    );

    vertexMarkers = [];


    /*
     * Leaflet LatLng 順序：
     * [lat, lng]
     */

    polygon =
        L.polygon(
            drawingPoints,
            {

                color: "#b45309",

                weight: 3,

                fillColor: "#f59e0b",

                fillOpacity: 0.25

            }
        ).addTo(map);


    polygon.bindPopup(
        "已選取分析範圍"
    );


    map.fitBounds(
        polygon.getBounds(),
        {
            padding: [40, 40]
        }
    );


    updatePolygonArea();


    setStatus(
        "範圍建立完成，可以開始 DTM 坡度分析。",
        "success"
    );

}


/* ============================================================
   更新 Polygon 面積
============================================================ */

function updatePolygonArea() {

    if (!polygon) {

        return;

    }


    const geojson =
        polygon.toGeoJSON();


    const area =
        turf.area(
            geojson
        );


    document.getElementById(
        "polygonArea"
    ).textContent =
        formatArea(area);

}


/* ============================================================
   清除繪製中的東西
============================================================ */

function clearDrawingOnly() {

    if (drawingLine) {

        map.removeLayer(
            drawingLine
        );

        drawingLine = null;

    }


    vertexMarkers.forEach(
        marker => {

            map.removeLayer(
                marker
            );

        }
    );


    vertexMarkers = [];

}


/* ============================================================
   清除 Polygon
============================================================ */

function clearPolygon() {

    drawing = false;

    drawingPoints = [];


    clearDrawingOnly();


    if (polygon) {

        map.removeLayer(
            polygon
        );

        polygon = null;

    }


    removeSlopeOverlay();


    resetResults();


    setStatus(
        "請先在地圖上繪製一個 Polygon。",
        "normal"
    );

}


/* ============================================================
   格式化面積
============================================================ */

function formatArea(area) {

    if (!Number.isFinite(area)) {

        return "—";

    }


    if (area >= 10000) {

        return (
            (area / 10000)
                .toLocaleString(
                    "zh-TW",
                    {
                        maximumFractionDigits: 2
                    }
                )
            + " 公頃"
        );

    }


    return (
        area.toLocaleString(
            "zh-TW",
            {
                maximumFractionDigits: 1
            }
        )
        + " m²"
    );

}


/* ============================================================
   WKT 產生器
============================================================ */

function polygonToWKT() {

    if (!polygon) {

        throw new Error(
            "尚未選取分析範圍"
        );

    }


    const latlngs =
        polygon.getLatLngs()[0];


    /*
     * API 要求：
     *
     * POLYGON(
     *   (
     *     lon lat,
     *     lon lat,
     *     ...
     *   )
     * )
     */


    const coords =
        latlngs.map(
            p => {

                return (
                    p.lng.toFixed(10)
                    + " "
                    + p.lat.toFixed(10)
                );

            }
        );


    /*
     * 關閉 Polygon
     */

    coords.push(
        coords[0]
    );


    return (
        "POLYGON(("
        + coords.join(",")
        + "))"
    );

}


/* ============================================================
   URL 編碼
============================================================ */

function buildApiUrl(
    apiPath,
    wkt,
    data
) {

    const encodedWkt =
        encodeURIComponent(
            wkt
        );


    const encodedData =
        encodeURIComponent(
            data
        );


    /*
     * API Key 為空字串。
     */

    return (
        DTM_API
        + apiPath
        + "/"
        + encodedWkt
        + "/"
        + encodedData
        + "/"
        + encodeURIComponent(
            API_KEY
        )
    );

}


/* ============================================================
   坡度分析
============================================================ */

async function analyzeSlope() {

    if (!polygon) {

        alert(
            "請先在地圖上繪製分析範圍。"
        );

        return;

    }


    const button =
        document.getElementById(
            "analyzeBtn"
        );


    button.disabled = true;

    button.textContent =
        "⏳ DTM 分析中…";


    removeSlopeOverlay();


    resetResults();


    try {

        const wkt =
            polygonToWKT();


        const data =
            document.getElementById(
                "demSelect"
            ).value;


        setStatus(
            "正在連接內政部 DTM 20m 坡度分析服務…",
            "normal"
        );


        /*
         * 同時取得：
         *
         * 1. 坡度統計
         * 2. 坡度分級
         * 3. 坡度分級影像
         */

        const rangeUrl =
            buildApiUrl(
                "/api/Slope/getSlopeRange",
                wkt,
                data
            );


        const classifyUrl =
            buildApiUrl(
                "/api/Slope/getSlopeClassify",
                wkt,
                data
            );


        const imageUrl =
            buildApiUrl(
                "/api/Slope/getSlopeImageFileLV7",
                wkt,
                data
            );


        const [
            rangeResponse,
            classifyResponse,
            imageResponse
        ] = await Promise.all([

            fetchJson(
                rangeUrl
            ),

            fetchJson(
                classifyUrl
            ),

            fetchJson(
                imageUrl
            )

        ]);


        /*
         * ================================
         * 坡度統計
         * ================================
         */

        const range =
            getFirstObject(
                rangeResponse
            );


        if (!range) {

            throw new Error(
                "DTM 坡度統計 API 沒有回傳資料。"
            );

        }


        displaySlopeRange(
            range
        );


        /*
         * ================================
         * 坡度分級
         * ================================
         */

        const classify =
            getFirstObject(
                classifyResponse
            );


        if (classify) {

            displaySlopeClassify(
                classify
            );

        }


        /*
         * ================================
         * 坡度圖
         * ================================
         */

        const imageInfo =
            getFirstObject(
                imageResponse
            );


        if (
            imageInfo &&
            imageInfo.imageURL &&
            imageInfo.bbox
        ) {

            addSlopeImage(
                imageInfo
            );

        }


        /*
         * DTM 有效面積
         */

        if (
            classify &&
            classify.area
        ) {

            document.getElementById(
                "dtmArea"
            ).textContent =
                formatArea(
                    Number(
                        classify.area
                    )
                );

        }
        else if (
            range.area
        ) {

            document.getElementById(
                "dtmArea"
            ).textContent =
                formatArea(
                    Number(
                        range.area
                    )
                );

        }


        setStatus(
            "DTM 坡度分析完成。",
            "success"
        );


    }
    catch (error) {

        console.error(
            "DTM API Error:",
            error
        );


        setStatus(
            "DTM 分析失敗：" +
            error.message +
            "。請確認網路連線及瀏覽器是否允許跨來源 API。",
            "error"
        );

    }
    finally {

        button.disabled =
            false;

        button.textContent =
            "⛰️ 開始計算坡度";

    }

}


/* ============================================================
   Fetch JSON
============================================================ */

async function fetchJson(url) {

    console.log(
        "DTM API:",
        url
    );


    const response =
        await fetch(
            url,
            {
                method: "GET",

                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP "
            + response.status
        );

    }


    const text =
        await response.text();


    if (!text) {

        throw new Error(
            "API 回傳空白資料"
        );

    }


    try {

        return JSON.parse(
            text
        );

    }
    catch (error) {

        console.error(
            "DTM API 原始回應：",
            text
        );

        throw new Error(
            "API 回傳格式不是 JSON"
        );

    }

}


/* ============================================================
   取得第一個物件
============================================================ */

function getFirstObject(data) {

    if (
        Array.isArray(data)
    ) {

        return data[0];

    }


    return data;

}


/* ============================================================
   顯示坡度統計
============================================================ */

function displaySlopeRange(
    range
) {

    /*
     * 官方 API 文件範例中的
     * min/max 欄位示例順序異常。
     *
     * 因此這裡採取數值排序，
     * 避免前端直接把 min/max 顯示反。
     */

    const avgPercent =
        Number(
            range.avgSlope_percent
        );


    const avgDegree =
        Number(
            range.avgSlope_degree
        );


    const a =
        Number(
            range.minSlope_percent
        );


    const b =
        Number(
            range.maxSlope_percent
        );


    let minPercent =
        Math.min(
            a,
            b
        );


    let maxPercent =
        Math.max(
            a,
            b
        );


    if (
        Number.isFinite(
            avgPercent
        )
    ) {

        document.getElementById(
            "avgSlope"
        ).textContent =
            avgPercent.toFixed(2)
            + " %";

    }


    if (
        Number.isFinite(
            avgDegree
        )
    ) {

        document.getElementById(
            "avgSlopeDegree"
        ).textContent =
            avgDegree.toFixed(2)
            + "°";

    }


    if (
        Number.isFinite(
            minPercent
        )
    ) {

        document.getElementById(
            "minSlope"
        ).textContent =
            minPercent.toFixed(2)
            + " %";

    }


    if (
        Number.isFinite(
            maxPercent
        )
    ) {

        document.getElementById(
            "maxSlope"
        ).textContent =
            maxPercent.toFixed(2)
            + " %";

    }


    if (range.area) {

        document.getElementById(
            "dtmArea"
        ).textContent =
            formatArea(
                Number(
                    range.area
                )
            );

    }

}


/* ============================================================
   顯示坡度分級
============================================================ */

function displaySlopeClassify(
    data
) {

    const arr =
        data.classifyArray ||
        [];


    if (!arr.length) {

        return;

    }


    /*
     * 依 classid：
     *
     * 1 ≤5
     * 2 >5~15
     * 3 >15~30
     * 4 >30~40
     * 5 >40~55
     * 6 >55~100
     * 7 >100
     */


    let area15Plus = 0;


    arr.forEach(
        item => {

            const classid =
                Number(
                    item.classid
                );


            const ratio =
                Number(
                    item.cellRatio
                );


            if (
                classid >= 3
            ) {

                area15Plus +=
                    ratio;

            }

        }
    );


    document.getElementById(
        "over15"
    ).textContent =
        (
            area15Plus * 100
        ).toFixed(2)
        + " %";


    /*
     * 產生橫向分布圖
     */

    const colors = [

        "#d9f0d3",
        "#addd8e",
        "#78c679",
        "#41ab5d",
        "#238443",
        "#006837",
        "#004529"

    ];


    const labels = [

        "≤5%",
        "5～15%",
        "15～30%",
        "30～40%",
        "40～55%",
        "55～100%",
        ">100%"

    ];


    let barHtml =
        '<div class="slope-bar">';


    arr.forEach(
        item => {

            const classid =
                Number(
                    item.classid
                );


            const ratio =
                Number(
                    item.cellRatio
                );


            const color =
                colors[
                    classid - 1
                ] ||
                "#999";


            barHtml +=
                '<div '
                + 'class="slope-segment" '
                + 'title="'
                + escapeHtml(
                    item.desc || ""
                )
                + "："
                + (
                    ratio * 100
                ).toFixed(2)
                + '%" '
                + 'style="width:'
                + (
                    ratio * 100
                )
                + '%;background:'
                + color
                + '">'
                + "</div>";

        }
    );


    barHtml +=
        "</div>";


    /*
     * 圖例
     */

    barHtml +=
        '<div class="legend">';


    arr.forEach(
        item => {

            const classid =
                Number(
                    item.classid
                );


            const ratio =
                Number(
                    item.cellRatio
                );


            const color =
                colors[
                    classid - 1
                ] ||
                "#999";


            barHtml +=
                '<div class="legend-row">'
                + '<span '
                + 'class="legend-color" '
                + 'style="background:'
                + color
                + '"></span>'
                + '<span>'
                + escapeHtml(
                    labels[
                        classid - 1
                    ] ||
                    item.desc ||
                    ""
                )
                + "　"
                + (
                    ratio * 100
                ).toFixed(2)
                + "%"
                + "</span>"
                + "</div>";

        }
    );


    barHtml +=
        "</div>";


    document.getElementById(
        "slopeDistribution"
    ).innerHTML =
        barHtml;

}


/* ============================================================
   坡度影像 Overlay
============================================================ */

let slopeImageLayer = null;


function addSlopeImage(
    imageInfo
) {

    removeSlopeOverlay();


    /*
     * API bbox 格式：
     *
     * minLon,
     * minLat,
     * maxLon,
     * maxLat
     */

    const bbox =
        imageInfo.bbox
            .split(",")
            .map(Number);


    if (
        bbox.length !== 4 ||
        bbox.some(
            value =>
                !Number.isFinite(value)
        )
    ) {

        console.warn(
            "DTM image bbox 無法解析：",
            imageInfo.bbox
        );

        return;

    }


    const bounds = [

        [
            bbox[1],
            bbox[0]
        ],

        [
            bbox[3],
            bbox[2]
        ]

    ];


    slopeImageLayer =
        L.imageOverlay(
            imageInfo.imageURL,
            bounds,
            {
                opacity: 0.72,

                interactive: false
            }
        ).addTo(map);


    /*
     * 保留原本 Polygon 在最上面
     */

    if (polygon) {

        polygon.bringToFront();

    }

}


/* ============================================================
   移除坡度圖
============================================================ */

function removeSlopeOverlay() {

    if (slopeImageLayer) {

        map.removeLayer(
            slopeImageLayer
        );

        slopeImageLayer = null;

    }

}

   Reset
============================================================ */

    document.getElementById(

    ).textContent =
        "—";


    document.getElementById(
        "minSlope"
    ).textContent =

    document.getElementById(
        "maxSlope"
    ).textContent =
        "—";


    document.getElementById(
        "over15"
    ).textContent =
        "—";


    document.getElementById(
        "slopeDistribution"
    ).textContent =

}


/* ============================================================
   Status
============================================================ */

function setStatus(
    message,
    type
) {

    const el =
        document.getElementById(
            "status"
        );


    el.textContent =
        message;


    el.className = "";


    if (
        type === "success"
    ) {

        el.classList.add(
            "success"
        );

    }
    else if (
        type === "error"
    ) {

        el.classList.add(
            "error"
        );

    }

}


/* ============================================================
   HTML escape
============================================================ */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
