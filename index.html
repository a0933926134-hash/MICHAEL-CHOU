```

    程式會再嘗試 NLSC URBAN WMTS。

</div>

<script>

/* =========================================================
   1. NLSC 服務設定
   ========================================================= */

const NLSC_WMS_URL =

    "https://wms.nlsc.gov.tw/wms";


const NLSC_WMTS_URL =

    "https://wmts.nlsc.gov.tw/wmts";


/* =========================================================
   2. 新北市中心
   ========================================================= */

const NEW_TAIPEI_CENTER = [

    25.012098,

    121.465675

];


/* =========================================================
   3. 新北市範圍
   ========================================================= */

const NEW_TAIPEI_BOUNDS =

    L.latLngBounds(

        [24.75, 121.25],

        [25.30, 122.05]

    );


/* =========================================================
   4. 建立 Leaflet
   ========================================================= */

const map = L.map(

    "map",

    {

        center:

            NEW_TAIPEI_CENTER,

        zoom:

            13,

        minZoom:

            8,

        maxZoom:

            19,

        zoomControl:

            true

    }

);


/* =========================================================
   5. NLSC EMAP
   ========================================================= */

const emap =

    L.tileLayer(

        NLSC_WMTS_URL +

        "/EMAP/default/EPSG:3857/" +

        "{z}/{y}/{x}",

        {

            attribution:

                "© 內政部國土測繪中心 NLSC",

            minZoom:

                0,

            maxZoom:

                19,

            tileSize:

                256,

            opacity:

                1

        }

    );


/* =========================================================
   6. OpenStreetMap
   ========================================================= */

const osm =

    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/" +

        "{z}/{x}/{y}.png",

        {

            attribution:

                "© OpenStreetMap contributors",

            maxZoom:

                19

        }

    );


/* =========================================================
   7. 預設底圖
   ========================================================= */

emap.addTo(map);


/* =========================================================
   8. 圖層控制
   ========================================================= */

L.control.layers(

    {

        "NLSC 臺灣通用電子地圖":

            emap,

        "OpenStreetMap":

            osm

    },

    {},

    {

        collapsed:

            false

    }

).addTo(map);


/* =========================================================
   9. 比例尺
   ========================================================= */

L.control.scale(

    {

        imperial:

            false,

        metric:

            true,

        position:

            "bottomleft"

    }

).addTo(map);


/* =========================================================
   10. 全域變數
   ========================================================= */

let urbanLayer = null;

let urbanWMSLayerName = null;

let urbanWMTSLayer = null;

let wmsLayers = [];


/* =========================================================
   11. UI
   ========================================================= */

function setStatus(

    message,

    type = ""

) {

    const el =

        document.getElementById(

            "status"

        );


    el.className =

        type
        ?
        "status-" + type
        :
        "";


    el.innerHTML =

        message;

}


/* =========================================================
   12. 滑鼠座標
   ========================================================= */

map.on(

    "mousemove",

    function(e) {

        document.getElementById(

            "coordinate"

        ).innerHTML =

            "<b>滑鼠座標：</b><br>" +

            "緯度： " +

            e.latlng.lat.toFixed(7) +

            "<br>" +

            "經度： " +

            e.latlng.lng.toFixed(7);

    }

);


/* =========================================================
   13. 地圖點擊
   ========================================================= */

map.on(

    "click",

    function(e) {

        const lat =

            e.latlng.lat.toFixed(8);

        const lng =

            e.latlng.lng.toFixed(8);


        L.popup()

            .setLatLng(e.latlng)

            .setContent(

                "<div class='urban-popup'>" +

                "<div class='urban-popup-title'>" +

                "地圖位置" +

                "</div>" +

                "<div class='urban-popup-row'>" +

                "緯度：" +

                lat +

                "</div>" +

                "<div class='urban-popup-row'>" +

                "經度：" +

                lng +

                "</div>" +

                "<hr>" +

                "<div>" +

                "都市計畫圖層：" +

                (

                    urbanWMSLayerName

                    ||

                    "尚未取得"

                ) +

                "</div>" +

                "</div>"

            )

            .openOn(map);

    }

);


/* =========================================================
   14. 定位新北市
   ========================================================= */

function goNewTaipei() {

    map.fitBounds(

        NEW_TAIPEI_BOUNDS,

        {

            padding:

                [20,20]

        }

    );

}


/* =========================================================
   15. 板橋測試位置
   ========================================================= */

function goBanqiao() {

    map.setView(

        [

            25.0119,

            121.4618

        ],

        15

    );

}


/* =========================================================
   16. 建立 GetCapabilities URL
   ========================================================= */

function getCapabilitiesURL() {

    return (

        NLSC_WMS_URL +

        "?SERVICE=WMS" +

        "&REQUEST=GetCapabilities" +

        "&VERSION=1.3.0"

    );

}


/* =========================================================
   17. 解析 WMS Layer
   ========================================================= */

function parseWMSLayers(xmlText) {

    const parser =

        new DOMParser();


    const xml =

        parser.parseFromString(

            xmlText,

            "text/xml"

        );


    const result = [];


    const layers =

        xml.getElementsByTagName(

            "Layer"

        );


    for (

        let i = 0;

        i < layers.length;

        i++

    ) {

        const layer =

            layers[i];


        const nameNode =

            layer.getElementsByTagName(

                "Name"

            )[0];


        const titleNode =

            layer.getElementsByTagName(

                "Title"

            )[0];


        if (!nameNode)

            continue;


        const name =

            nameNode.textContent.trim();


        const title =

            titleNode

            ?

            titleNode.textContent.trim()

            :

            "";


        result.push({

            name,

            title

        });

    }


    return result;

}


/* =========================================================
   18. 搜尋都市計畫圖層
   ========================================================= */

function findUrbanLayers(layers) {

    const keywords = [

        "都市計畫",

        "都市计划",

        "使用分區",

        "使用分区",

        "都市計畫使用分區",

        "都市計畫區",

        "都市計畫使用分區圖",

        "URBAN"

    ];


    return layers.filter(

        layer => {

            const text =

                (

                    layer.name +

                    " " +

                    layer.title

                ).toUpperCase();


            return keywords.some(

                keyword =>

                    text.includes(

                        keyword.toUpperCase()

                    )

            );

        }

    );

}


/* =========================================================
   19. 顯示 WMS Layer 清單
   ========================================================= */

function showLayerList(

    layers,

    urbanLayers

) {

    const list =

        document.getElementById(

            "layerList"

        );


    if (!layers.length) {

        list.innerHTML =

            "沒有取得 WMS Layer。";

        return;

    }


    let html = "";


    html +=

        "<b>WMS Layer 總數：</b>" +

        layers.length +

        "<br><br>";


    if (urbanLayers.length) {

        html +=

            "<b>🔎 找到可能的都市計畫圖層：</b>";

        html +=

            "<br>";

    }

    else {

        html +=

            "<b>⚠ 尚未找到名稱包含都市計畫的 Layer</b>";

        html +=

            "<br>";

    }


    urbanLayers.forEach(

        layer => {

            html +=

                "<div class='layerItem'>" +

                "<b>" +

                escapeHTML(

                    layer.name

                ) +

                "</b><br>" +

                escapeHTML(

                    layer.title

                ) +

                "</div>";

        }

    );


    list.innerHTML =

        html;


    document.getElementById(

        "layerInfo"

    ).innerHTML =

        "WMS： " +

        NLSC_WMS_URL +

        "<br>" +

        "搜尋到都市計畫 Layer： " +

        urbanLayers.length;

}


/* =========================================================
   20. HTML Escape
   ========================================================= */

function escapeHTML(str) {

    return String(str)

        .replace(

            /&/g,

            "&amp;"

        )

        .replace(

            /</g,

            "&lt;"

        )

        .replace(

            />/g,

            "&gt;"

        )

        .replace(

            /"/g,

            "&quot;"

        )

        .replace(

            /'/g,

            "&#039;"

        );

}


/* =========================================================
   21. 取得 WMS GetCapabilities
   ========================================================= */

async function loadWMSCapabilities() {

    setStatus(

        "正在取得 NLSC WMS GetCapabilities..."

    );


    const url =

        getCapabilitiesURL();


    console.log(

        "NLSC WMS GetCapabilities：",

        url

    );


    try {

        const response =

            await fetch(

                url,

                {

                    method:

                        "GET"

                }

            );


        if (!response.ok) {

            throw new Error(

                "HTTP " +

                response.status

            );

        }


        const text =

            await response.text();


        console.log(

            "NLSC WMS GetCapabilities",

            text

        );


        const layers =

            parseWMSLayers(

                text

            );


        wmsLayers =

            layers;


        const urbanLayers =

            findUrbanLayers(

                layers

            );


        showLayerList(

            layers,

            urbanLayers

        );


        if (

            urbanLayers.length

        ) {

            urbanWMSLayerName =

                urbanLayers[0].name;


            setStatus(

                "✅ NLSC WMS 連線成功<br>" +

                "找到 " +

                urbanLayers.length +

                " 個可能的都市計畫圖層。",

                "ok"

            );

        }

        else {

            setStatus(

                "⚠ NLSC WMS 連線成功，但目前 GetCapabilities 中沒有找到名稱包含「都市計畫／使用分區」的圖層。",

                "warn"

            );

        }


        return urbanLayers;

    }

    catch(error) {

        console.error(

            "WMS GetCapabilities 錯誤：",

            error

        );


        setStatus(

            "❌ 無法從瀏覽器取得 NLSC WMS GetCapabilities。<br>" +

            escapeHTML(

                error.message

            ) +

            "<br><br>" +

            "將改嘗試 URBAN WMTS。",

            "error"

        );


        return [];

    }

}


/* =========================================================
   22. 載入都市計畫 WMS
   ========================================================= */

async function loadUrbanWMS() {

    setStatus(

        "正在搜尋 NLSC 都市計畫圖層..."

    );


    const urbanLayers =

        await loadWMSCapabilities();


    if (

        urbanLayers.length

    ) {

        const target =

            urbanLayers[0];


        console.log(

            "選擇都市計畫 WMS：",

            target

        );


        removeUrban();


        urbanLayer =

            L.tileLayer.wms(

                NLSC_WMS_URL,

                {

                    layers:

                        target.name,

                    format:

                        "image/png",

                    transparent:

                        true,

                    version:

                        "1.3.0",

                    crs:

                        L.CRS.EPSG3857,

                    opacity:

                        0.75,

                    attribution:

                        "© 內政部國土測繪中心 NLSC - 都市計畫使用分區圖"

                }

            );


        urbanLayer.on(

            "loading",

            function() {

                setStatus(

                    "正在載入都市計畫 WMS：<br>" +

                    escapeHTML(

                        target.name

                    )

                );

            }

        );


        urbanLayer.on(

            "load",

            function() {

                setStatus(

                    "✅ 都市計畫 WMS 載入完成<br>" +

                    "Layer： " +

                    escapeHTML(

                        target.name

                    ),

                    "ok"

                );

            }

        );


        urbanLayer.on(

            "tileerror",

            function(e) {

                console.error(

                    "Urban WMS Tile Error",

                    e

                );


                setStatus(

                    "❌ 都市計畫 WMS Tile 載入失敗。<br>" +

                    "請查看 F12 Console。",

                    "error"

                );

            }

        );


        urbanLayer.addTo(map);


        L.control.layers(

            null,

            {

                "NLSC 都市計畫使用分區":

                    urbanLayer

            },

            {

                collapsed:

                    true,

                position:

                    "topright"

            }

        ).addTo(map);


        return;

    }


    /* =====================================================
       WMS 沒找到
       嘗試 URBAN WMTS
       ===================================================== */

    loadUrbanWMTS();

}


/* =========================================================
   23. URBAN WMTS 備援
   ========================================================= */

function loadUrbanWMTS() {

    setStatus(

        "WMS 沒有找到都市計畫 Layer，" +

        "正在嘗試 NLSC URBAN WMTS..."

    );


    removeUrban();


    urbanWMTSLayer =

        L.tileLayer(

            NLSC_WMTS_URL +

            "/URBAN/default/EPSG:3857/" +

            "{z}/{y}/{x}",

            {

                tileSize:

                    256,

                minZoom:

                    0,

                maxZoom:

                    19,

                opacity:

                    0.75,

                crossOrigin:

                    true,

                attribution:

                    "© 內政部國土測繪中心 NLSC - URBAN"

            }

        );


    urbanWMTSLayer.on(

        "tileload",

        function(e) {

            console.log(

                "URBAN WMTS Tile OK:",

                e.tile.src

            );


            setStatus(

                "✅ URBAN WMTS Tile 載入成功。",

                "ok"

            );

        }

    );


    urbanWMTSLayer.on(

        "tileerror",

        function(e) {

            console.error(

                "URBAN WMTS Tile Error:",

                e.tile?.src,

                e

            );


            setStatus(

                "❌ URBAN WMTS Tile 載入失敗。<br>" +

                "這表示目前瀏覽器無法直接使用 URBAN WMTS。<br><br>" +

                "請查看 F12 Console 中的完整 Tile URL。",

                "error"

            );

        }

    );


    urbanWMTSLayer.addTo(

        map

    );


    urbanWMSLayerName =

        "URBAN";


    L.control.layers(

        null,

        {

            "NLSC URBAN 都市計畫":

                urbanWMTSLayer

        },

        {

            collapsed:

                true,

            position:

                "topright"

        }

    ).addTo(map);

}


/* =========================================================
   24. 移除都市計畫
   ========================================================= */

function removeUrban() {

    if (

        urbanLayer &&

        map.hasLayer(

            urbanLayer

        )

    ) {

        map.removeLayer(

            urbanLayer

        );

    }


    if (

        urbanWMTSLayer &&

        map.hasLayer(

            urbanWMTSLayer

        )

    ) {

        map.removeLayer(

            urbanWMTSLayer

        );

    }


    urbanLayer =

        null;

    urbanWMTSLayer =

        null;

}


/* =========================================================
   25. 重新取得 Capabilities
   ========================================================= */

async function reloadCapabilities() {

    setStatus(

        "重新取得 NLSC WMS 圖層..."

    );


    await loadWMSCapabilities();

}


/* =========================================================
   26. EMAP Tile 狀態
   ========================================================= */

emap.on(

    "tileerror",

    function(e) {

        console.error(

            "EMAP Tile Error:",

            e

        );

    }

);


/* =========================================================
   27. 初始化
   ========================================================= */

(async function() {

    console.log(

        "======================================"

    );

    console.log(

        "NLSC 新北市都市計畫 Leaflet GIS"

    );

    console.log(

        "======================================"

    );


    console.log(

        "WMS：",

        NLSC_WMS_URL

    );


    console.log(

        "WMTS：",

        NLSC_WMTS_URL

    );


    console.log(

        "Urban WMTS：",

        NLSC_WMTS_URL +

        "/URBAN/default/EPSG:3857/{z}/{y}/{x}"

    );


    setStatus(

        "Leaflet 已啟動，正在檢查 NLSC WMS..."

    );


    await loadWMSCapabilities();

})();

</script>
