<script>

/* ============================================================
   ============================================================
   
                MAP ENGINE
   
   ============================================================
   ============================================================ */


const map = L.map(
    "map",
    {
        center: [
            25.077,
            121.389
        ],
        zoom: 14
    }
);


/* =========================================================
   NLSC 電子地圖
   ========================================================= */

const nlscEMAP =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}",
        {
            maxZoom: 20,

            attribution:
                "© 內政部國土測繪中心"
        }
    );


/* =========================================================
   NLSC 正射影像
   ========================================================= */

const nlscPhoto =
    L.tileLayer(
        "https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}",
        {
            maxZoom: 20,

            attribution:
                "© 內政部國土測繪中心"
        }
    );


/* =========================================================
   OSM
   ========================================================= */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "© OpenStreetMap contributors"
        }
    );


nlscEMAP.addTo(map);


/* =========================================================
   Layer Control
   ========================================================= */

const baseMaps = {

    "NLSC 電子地圖":
        nlscEMAP,

    "NLSC 正射影像":
        nlscPhoto,

    "OpenStreetMap":
        osm

};


L.control.layers(
    baseMaps,
    {},
    {
        collapsed: true
    }
).addTo(map);


/* =========================================================
   Scale
   ========================================================= */

L.control.scale({
    imperial: false
}).addTo(map);


/* ============================================================
   ============================================================
   
                  POLYGON ENGINE
   
   ============================================================
   ============================================================ */


const PolygonEngine = (() => {


    let drawing = false;

    let points = [];

    let tempLine = null;

    let polygon = null;


    function startDrawing() {

        drawing = true;

        points = [];


        if (tempLine) {

            map.removeLayer(
                tempLine
            );

            tempLine = null;

        }


        if (polygon) {

            map.removeLayer(
                polygon
            );

            polygon = null;

        }


        setStatus(
            "請在地圖上依序點擊 Polygon 頂點，完成後按「完成」。"
        );


        map.getContainer().style.cursor =
            "crosshair";


        map.on(
            "click",
            handleClick
        );

    }


    function handleClick(e) {

        if (!drawing) return;


        points.push([
            e.latlng.lat,
            e.latlng.lng
        ]);


        if (tempLine) {

            map.removeLayer(
                tempLine
            );

        }


        tempLine =
            L.polyline(
                points,
                {
                    color: "#1976d2",
                    weight: 3,
                    dashArray: "6,6"
                }
            ).addTo(map);

    }


    function finish() {

        if (
            !drawing ||
            points.length < 3
        ) {

            alert(
                "至少需要 3 個點才能建立 Polygon。"
            );

            return;

        }


        drawing = false;


        map.off(
            "click",
            handleClick
        );


        map.getContainer().style.cursor =
            "";


        if (tempLine) {

            map.removeLayer(
                tempLine
            );

            tempLine = null;

        }


        if (polygon) {

            map.removeLayer(
                polygon
            );

        }


        polygon =
            L.polygon(
                points,
                {
                    color: "#1565c0",
                    weight: 3,
                    fillOpacity: 0.18
                }
            ).addTo(map);


        setStatus(
            "Polygon 建立完成，可以執行「查詢 Polygon 內 POI」。"
        );

    }


    function clear() {

        drawing = false;

        points = [];


        map.off(
            "click",
            handleClick
        );


        map.getContainer().style.cursor =
            "";


        if (tempLine) {

            map.removeLayer(
                tempLine
            );

            tempLine = null;

        }


        if (polygon) {

            map.removeLayer(
                polygon
            );

            polygon = null;

        }


        setStatus(
            "Polygon 已清除。"
        );

    }


    function getPolygon() {

        return polygon;

    }


    return {

        startDrawing,

        finish,

        clear,

        getPolygon

    };


})();


/* ============================================================

   ============================================================
   ============================================================ */


const POISource = (() => {


    /* ========================================================
       Overpass Servers
       ======================================================== */

    const endpoints = [

        "https://overpass-api.de/api/interpreter",

        "https://overpass.kumi.systems/api/interpreter",

        "https://overpass.private.coffee/api/interpreter"

    ];


    /* ========================================================
       建立 Query
       ======================================================== */

    function buildQuery(

        lon,
        radius,
        selectedTypes
    ) {


        const filters = [];


        /* ----------------------------------------------------
           學校
           ---------------------------------------------------- */

        ) {

            filters.push(
                `node["amenity"="bank"](around:${radius},${lat},${lon});`
            );

            filters.push(
                `way["amenity"="bank"](around:${radius},${lat},${lon});`
            );

        }


        /* ----------------------------------------------------
           醫院
           ---------------------------------------------------- */

        if (
            selectedTypes.includes(
                "hospital"
            )
        ) {

            filters.push(
                `node["amenity"="hospital"](around:${radius},${lat},${lon});`
            );

            filters.push(
                `way["amenity"="hospital"](around:${radius},${lat},${lon});`
            );

            filters.push(
                `relation["amenity"="hospital"](around:${radius},${lat},${lon});`
            );

        }


        /* ----------------------------------------------------
           機關
           ---------------------------------------------------- */

        if (
            selectedTypes.includes(
                "government"
            )
        ) {

            filters.push(
                `node["office"="government"](around:${radius},${lat},${lon});`
            );

            filters.push(
                `way["office"="government"](around:${radius},${lat},${lon});`
            );

            filters.push(
                `relation["office"="government"](around:${radius},${lat},${lon});`
            );

        }


        return `

[out:json][timeout:120];

(
${filters.join("\n")}
);

out center tags;

`;

    }


    /* ========================================================
       查詢
       ======================================================== */

    async function query(
        lat,
        lon,
        radius,
        selectedTypes
    ) {


        const queryText =
            buildQuery(
                lat,
                lon,
                radius,
                selectedTypes
            );


        let lastError = null;


        for (
            const endpoint
            of endpoints
        ) {


            try {

                setStatus(
                    "正在連線：" +
                    endpoint
                );


                const response =
                    await fetch(
                        endpoint,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                "data=" +
                                encodeURIComponent(
                                    queryText
                                )
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                return data.elements || [];


            } catch (error) {

                lastError =
                    error;

                console.warn(
                    "Overpass failed:",
                    endpoint,
                    error
                );

            }

        }


        throw (
            lastError ||
            new Error(
                "所有資料服務均無法連線"
            )
        );

    }


    return {

        query

    };


})();


/* ============================================================
   ============================================================
   
                     FEATURE NORMALIZER
   
   ============================================================
   ============================================================ */


const FeatureNormalizer = (() => {


    const categoryMap = {


        school_primary: {
            main: "學校",
            sub: "國民小學"
        },


        school_junior: {
            main: "學校",
            sub: "國民中學"
        },


        school_senior: {
            main: "學校",
            sub: "高中職"
        },


        school_college: {
            main: "學校",
            sub: "大專院校"
        },


        market_traditional: {
            main: "市場",
            sub: "傳統市場"
        },


        market_supermarket: {
            main: "市場",
            sub: "超級市場"
        },


        market_mall: {
            main: "市場",
            sub: "超大型購物中心"
        },


        park: {
            main: "公園／廣場／徒步區",
            sub: "公園"
        },


        square: {
            main: "公園／廣場／徒步區",
            sub: "廣場"
        },


        pedestrian: {
            main: "公園／廣場／徒步區",
            sub: "徒步區"
        },


        tourism: {
            main: "觀光遊憩設施",
            sub: "觀光遊憩"
        },


        parking: {
            main: "停車場地",
            sub: "停車場"
        },


        post_office: {
            main: "服務性設施",
            sub: "郵局"
        },


        bank: {
            main: "服務性設施",
            sub: "銀行"
        },


        hospital: {
            main: "服務性設施",
            sub: "醫院"
        },


        government: {
            main: "服務性設施",
            sub: "機關"
        }

    };


    /* ========================================================
       判斷 Feature 類別
       ======================================================== */

    function detectType(
        element
    ) {


        const tags =
            element.tags || {};


        const amenity =
            tags.amenity || "";


        const shop =
            tags.shop || "";


        const leisure =
            tags.leisure || "";


        const tourism =
            tags.tourism || "";


        const highway =
            tags.highway || "";


        const office =
            tags.office || "";


        const place =
            tags.place || "";


        /* 學校 */

        if (
            amenity === "school"
        ) {

            const text =
                [
                    tags.name,
                    tags["school:type"],
                    tags.operator
                ]
                .join(" ");


            if (
                /小學|國小/i.test(
                    text
                )
            ) {

                return "school_primary";

            }


            if (
                /國中|初中/i.test(
                    text
                )
            ) {

                return "school_junior";

            }


            if (
                /高中|高職|高中職/i.test(
                    text
                )
            ) {

                return "school_senior";

            }


            /*
             * 沒有明確標示時，
             * 一般 school 暫歸國中小／學校。
             */

            return "school_primary";

        }


        /* 大專 */

        if (
            amenity === "college" ||
            amenity === "university"
        ) {

            return "school_college";

        }


        /* 傳統市場 */

        if (
            amenity === "marketplace"
        ) {

            return "market_traditional";

        }


        /* 超市 */

        if (
            shop === "supermarket"
        ) {

            return "market_supermarket";

        }


        /* 購物中心 */

        if (
            shop === "mall"
        ) {

            return "market_mall";

        }


        /* 公園 */

        if (
            leisure === "park"
        ) {

            return "park";

        }


        /* 廣場 */

        if (
            place === "square" ||
            leisure === "common"
        ) {

            return "square";

        }


        /* 徒步區 */

        if (
            highway === "pedestrian"
        ) {

            return "pedestrian";

        }


        /* 遊憩 */

        if (
            tourism
        ) {

            return "tourism";

        }


        /* 停車 */

        if (
            amenity === "parking"
        ) {

            return "parking";

        }


        /* 郵局 */

        if (
            amenity === "post_office"
        ) {

            return "post_office";

        }


        /* 銀行 */

        if (
            amenity === "bank"
        ) {

            return "bank";

        }


        /* 醫院 */

        if (
            amenity === "hospital"
        ) {

            return "hospital";

        }


        /* 機關 */

        if (
            office === "government"
        ) {

            return "government";

        }


        return null;

    }


    /* ========================================================
       Normalize
       ======================================================== */

    function normalize(
        element
    ) {


        if (!element)
            return null;


        let lat = null;
        let lon = null;


        if (
            element.type === "node" &&
            Number.isFinite(
                element.lat
            ) &&
            Number.isFinite(
                element.lon
            )
        ) {

            lat =
                element.lat;

            lon =
                element.lon;

        }


        else if (
            element.center &&
            Number.isFinite(
                element.center.lat
            ) &&
            Number.isFinite(
                element.center.lon
            )
        ) {

            lat =
                element.center.lat;

            lon =
                element.center.lon;

        }


        if (
            lat === null ||
            lon === null
        ) {

            return null;

        }


        const tags =
            element.tags || {};


        const type =
            detectType(
                element
            );


        if (!type)
            return null;


        const category =
            categoryMap[type];


        if (!category)
            return null;


        const name =
            tags.name ||
            tags["name:zh"] ||
            tags["name:zh-Hant"] ||
            "未命名";


        return {

            id:
                "osm_" +
                element.type +
                "_" +
                element.id,

            type:

                type,

            category:

                category.main,

            subcategory:

                category.sub,

            name:

                name,

            lat:

                lat,

            lon:

                lon,

            geometry: {

                type:
                    "Point",

                coordinates: [
                    lon,
                    lat
                ]

            },

            source:
                "OpenStreetMap / Overpass",

            properties:
                tags,

            raw:
                element

        };

    }


    return {

        normalize

    };


})();


/* ============================================================
   ============================================================
   
                       POI ENGINE
   
   ============================================================
   ============================================================ */


const POIEngine = (() => {


    /* ========================================================
       Repository
       ======================================================== */

    let repository = [];


    /* ========================================================
       Layer
       ======================================================== */

    const layers = {};


    /* ========================================================
       Category Icons
       ======================================================== */

    const icons = {


        "學校":
            "🏫",

        "市場":
            "🛒",

        "公園／廣場／徒步區":
            "🌳",

        "觀光遊憩設施":
            "🏞️",

        "停車場地":
            "🅿️",

        "服務性設施":
            "🏥"

    };


    /* ========================================================
       初始化 Layer
       ======================================================== */

    function getLayer(
        category
    ) {


        if (
            !layers[category]
        ) {

            layers[category] =
                L.layerGroup()
                .addTo(map);

        }


        return layers[
            category
        ];

    }


    /* ========================================================
       查詢
       ======================================================== */

    async function query() {


        const lat =
            Number(
                document.getElementById(
                    "inputLat"
                ).value
            );


        const lon =
            Number(
                document.getElementById(
                    "inputLon"
                ).value
            );


        const radius =
            Number(
                document.getElementById(
                    "inputRadius"
                ).value
            );


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon) ||
            !Number.isFinite(radius)
        ) {

            alert(
                "請輸入正確的座標及半徑。"
            );

            return;

        }


        const selectedTypes =
            Array.from(
                document.querySelectorAll(
                    ".poiType:checked"
                )
            )
            .map(
                el => el.value
            );


        if (
            !selectedTypes.length
        ) {

            alert(
                "請至少選擇一種 POI 類別。"
            );

            return;

        }


        clearRepository();


        setStatus(
            "開始查詢 POI..."
        );


        try {


            const elements =
                await POISource.query(
                    lat,
                    lon,
                    radius,
                    selectedTypes
                );


            const normalized =
                elements
                    .map(
                        FeatureNormalizer.normalize
                    )
                    .filter(
                        Boolean
                    );


            repository =
                deduplicate(
                    normalized
                );


            renderRepository();


            updateStatistics();


            renderList();


            map.setView(
                [
                    lat,
                    lon
                ],
                Math.max(
                    12,
                    map.getZoom()
                )
            );


            setStatus(
                `查詢完成：${repository.length} 筆 POI`,
                "success"
            );


        } catch (error) {


            console.error(
                error
            );


            setStatus(
                "POI 查詢失敗：" +
                error.message,
                "error"
            );


            alert(
                "POI 查詢失敗。\n\n" +
                error.message
            );

        }

    }


    /* ========================================================
       去重
       ======================================================== */

    function deduplicate(
        list
    ) {


        const mapData =
            new Map();


        for (
            const feature
            of list
        ) {


            const key =
                [
                    feature.type,
                    feature.name,
                    feature.lat.toFixed(6),
                    feature.lon.toFixed(6)
                ].join("|");


            if (
                !mapData.has(key)
            ) {

                mapData.set(
                    key,
                    feature
                );

            }

        }


        return Array.from(
            mapData.values()
        );

    }


    /* ========================================================
       Render
       ======================================================== */

    function renderRepository() {


        /*
         * 清空所有分類 Layer
         */

        Object.values(
            layers
        ).forEach(
            layer => {

                layer.clearLayers();

            }
        );


        /*
         * 建立 Marker
         */

        repository.forEach(
            (
                feature,
                index
            ) => {


                const layer =
                    getLayer(
                        feature.category
                    );


                const marker =
                    L.marker(
                        [
                            feature.lat,
                            feature.lon
                        ]
                    );


                const icon =
                    icons[
                        feature.category
                    ] || "📍";


                marker.bindPopup(`

                    <div
                        style="
                            min-width:220px;
                        "
                    >

                        <div
                            style="
                                font-weight:bold;
                                font-size:16px;
                                margin-bottom:8px;
                            "
                        >

                            ${icon}

                            ${escapeHtml(
                                feature.name
                            )}

                        </div>


                        <div>

                            類別：
                            ${escapeHtml(
                                feature.category
                            )}

                        </div>


                        <div>

                            子類別：
                            ${escapeHtml(
                                feature.subcategory
                            )}

                        </div>


                        <div>

                            緯度：
                            ${feature.lat.toFixed(
                                7
                            )}

                        </div>


                        <div>

                            經度：
                            ${feature.lon.toFixed(
                                7
                            )}

                        </div>


                        <div>

                            資料來源：
                            ${escapeHtml(
                                feature.source
                            )}

                        </div>

                    </div>

                `);


                marker.on(
                    "click",
                    () => {

                        selectRow(
                            index
                        );

                    }
                );


                feature._marker =
                    marker;


                feature._index =
                    index;


                layer.addLayer(
                    marker
                );

            }
        );

    }


    /* ========================================================
       Polygon Spatial Query
       ======================================================== */

    function queryPolygon() {


        const polygon =
            PolygonEngine
                .getPolygon();


        if (!polygon) {

            alert(
                "請先繪製 Polygon。"
            );

            return;

        }


        if (
            !repository.length
        ) {

            alert(
                "目前沒有 POI 資料。\n\n請先執行 POI 查詢。"
            );

            return;

        }


        const latlngs =
            polygon.getLatLngs()[0];


        const coordinates =
            latlngs.map(
                p => [
                    p.lng,
                    p.lat
                ]
            );


        /*
         * GeoJSON Polygon
         */

        coordinates.push(
            coordinates[0]
        );


        const polygonFeature =
            turf.polygon([
                coordinates
            ]);


        const inside =
            repository.filter(
                feature => {


                    const point =
                        turf.point([
                            feature.lon,
                            feature.lat
                        ]);


                    return turf.booleanPointInPolygon(
                        point,
                        polygonFeature
                    );

                }
            );


        repository.forEach(
            feature => {

                feature._insidePolygon =
                    false;

            }
        );


        inside.forEach(
            feature => {

                feature._insidePolygon =
                    true;

            }
        );


        renderList(
            inside
        );


        updateStatistics(
            inside
        );


        setStatus(
            `Polygon 空間分析完成：${inside.length} 筆 POI`,
            "success"
        );


        /*
         * 只顯示 Polygon 內 POI
         */

        Object.values(
            layers
        ).forEach(
            layer => {

                layer.clearLayers();

            }
        );


        inside.forEach(
            feature => {

                const layer =
                    getLayer(
                        feature.category
                    );


                if (
                    feature._marker
                ) {

                    layer.addLayer(
                        feature._marker
                    );

                }

            }
        );

    }


    /* ========================================================
       Statistics
       ======================================================== */

    function updateStatistics(
        target
    ) {


        const list =
            target || repository;


        if (!list.length) {

            document.getElementById(
                "statistics"
            ).innerHTML =
                "沒有資料";

            return;

        }


        const mainCount =
            {};


        const subCount =
            {};


        list.forEach(
            feature => {


                mainCount[
                    feature.category
                ] =
                    (
                        mainCount[
                            feature.category
                        ] || 0
                    ) + 1;


                subCount[
                    feature.subcategory
                ] =
                    (
                        subCount[
                            feature.subcategory
                        ] || 0
                    ) + 1;

            }
        );


        let html =
            `<b>總筆數：</b>${list.length}<br><br>`;


        html +=
            "<b>主要類別</b><br>";


        Object.entries(
            mainCount
        ).forEach(
            ([
                name,
                count
            ]) => {

                html +=
                    `${icons[name] || "📍"} ${name}：${count}<br>`;

            }
        );


        html +=
            "<br><b>細分類別</b><br>";


        Object.entries(
            subCount
        ).forEach(
            ([
                name,
                count
            ]) => {

                html +=
                    `${name}：${count}<br>`;

            }
        );


        document.getElementById(
            "statistics"
        ).innerHTML =
            html;

    }


    /* ========================================================
       List
       ======================================================== */

    function renderList(
        target
    ) {


        const list =
            target || repository;


        const container =
            document.getElementById(
                "poiList"
            );


        if (!list.length) {

            container.innerHTML =
                "沒有 POI 資料";

            return;

        }


        let html = "";


        list.forEach(
            (
                feature,
                index
            ) => {


                const actualIndex =
                    repository.indexOf(
                        feature
                    );


                html += `

                    <div
                        id="
                            poi-row-${actualIndex}
                        "
                        class="
                            poi-row
                        "
                        onclick="
                            POIEngine.focus(
                                ${actualIndex}
                            )
                        "
                    >

                        <div
                            class="
                                poi-name
                            "
                        >

                            ${icons[
                                feature.category
                            ] || "📍"}

                            ${escapeHtml(
                                feature.name
                            )}

                        </div>


                        <div
                            class="
                                poi-meta
                            "
                        >

                            ${escapeHtml(
                                feature.category
                            )}
                            /
                            ${escapeHtml(
                                feature.subcategory
                            )}

                        </div>


                        <div
                            class="
                                poi-meta
                            "
                        >

                            緯度：
                            ${feature.lat.toFixed(
                                6
                            )}

                            <br>

                            經度：
                            ${feature.lon.toFixed(
                                6
                            )}

                        </div>

                    </div>

                `;

            }
        );


        container.innerHTML =
            html;

    }


    /* ========================================================
       Focus
       ======================================================== */

    function focus(
        index
    ) {


        const feature =
            repository[index];


        if (!feature)
            return;


        map.setView(
            [
                feature.lat,
                feature.lon
            ],
            18
        );


        if (
            feature._marker
        ) {

            feature._marker.openPopup();

        }


        selectRow(
            index
        );

    }


    /* ========================================================
       Select Row
       ======================================================== */

    function selectRow(
        index
    ) {


        document
            .querySelectorAll(
                ".poi-row"
            )
            .forEach(
                row => {

                    row.classList.remove(
                        "selected"
                    );

                }
            );


        const row =
            document.getElementById(
                `poi-row-${index}`
            );


        if (row) {

            row.classList.add(
                "selected"
            );


            row.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

        }

    }


    /* ========================================================
       Clear
       ======================================================== */

    function clearRepository() {

        repository = [];


        Object.values(
            layers
        ).forEach(
            layer => {

                layer.clearLayers();

            }
        );


        document.getElementById(
            "poiList"
        ).innerHTML =
            "尚無資料";


        document.getElementById(
            "statistics"
        ).innerHTML =
            "尚未查詢";

    }


    function clear() {

        clearRepository();


        setStatus(
            "POI 資料已清除。"
        );

    }


    /* ========================================================
       CSV
       ======================================================== */

    function exportCSV() {


        if (
            !repository.length
        ) {

            alert(
                "沒有 POI 可以匯出。"
            );

            return;

        }


        const rows = [];


        rows.push([
            "編號",
            "主要類別",
            "子類別",
            "名稱",
            "緯度",
            "經度",
            "資料來源"
        ]);


        repository.forEach(
            (
                feature,
                index
            ) => {

                rows.push([

                    index + 1,

                    feature.category,

                    feature.subcategory,

                    feature.name,

                    feature.lat,

                    feature.lon,

                    feature.source

                ]);

            }
        );


        const csv =
            "\uFEFF" +
            rows
                .map(
                    row =>
                        row
                            .map(
                                csvEscape
                            )
                            .join(",")
                )
                .join("\r\n");


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8"
                }
            );


        downloadBlob(
            blob,
            "GIS_POI資料.csv"
        );

    }


    /* ========================================================
       Excel
       ======================================================== */

    function exportXLSX() {


        if (
            !repository.length
        ) {

            alert(
                "沒有 POI 可以匯出。"
            );

            return;

        }


        if (
            typeof XLSX ===
            "undefined"
        ) {

            alert(
                "SheetJS 尚未載入。"
            );

            return;

        }


        const data =
            repository.map(
                (
                    feature,
                    index
                ) => ({

                    "編號":
                        index + 1,

                    "主要類別":
                        feature.category,

                    "子類別":
                        feature.subcategory,

                    "名稱":
                        feature.name,

                    "緯度":
                        feature.lat,

                    "經度":
                        feature.lon,

                    "資料來源":
                        feature.source

                })
            );


        const worksheet =
            XLSX.utils.json_to_sheet(
                data
            );


        worksheet["!cols"] = [

            {
                wch: 8
            },

            {
                wch: 24
            },

            {
                wch: 20
            },

            {
                wch: 35
            },

            {
                wch: 15
            },

            {
                wch: 15
            },

            {
                wch: 30
            }

        ];


        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "POI資料"
        );


        XLSX.writeFile(
            workbook,
            "GIS_POI資料.xlsx"
        );

    }


    /* ========================================================
       Public API
       ======================================================== */

    return {

        query,

        queryPolygon,

        clear,

        focus,

        exportCSV,

        exportXLSX,

        getFeatures:
            () =>
                repository.slice()

    };


})();


/* ============================================================
   ============================================================
   
                      Utility
   
   ============================================================
   ============================================================ */


function setStatus(
    message,
    type
) {


    const el =
        document.getElementById(
            "status"
        );


    el.className = "";


    if (
        type === "success"
    ) {

        el.classList.add(
            "success"
        );

    }


    if (
        type === "error"
    ) {

        el.classList.add(
            "error"
        );

    }


    el.innerHTML =
        message;

}


function escapeHtml(
    value
) {


    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function csvEscape(
    value
) {


    const text =
        String(
            value ?? ""
        );


    if (
        /[",\r\n]/.test(
            text
        )
    ) {

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';

    }


    return text;

}


function downloadBlob(
    blob,
    filename
) {


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        filename;


    document.body.appendChild(
        a
    );


    a.click();


    document.body.removeChild(
        a
    );


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* ============================================================
   初始化
   ============================================================ */

setStatus(
    "GIS POI Engine 已初始化。"
);

</script>
