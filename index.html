<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市價徵收查估作業系統 v1.1.0 Enhanced TWD97 Edition</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/shpjs@4.0.4/dist/shp.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:"Microsoft JhengHei","Segoe UI",Arial,sans-serif; }
  #app { display:flex; height:100vh; }
  #sidebar {
    width:360px; min-width:360px; background:#fff; border-right:1px solid #e2e8f0;
    overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:14px;
  }
  #map { flex:1; position:relative; }
  h1 { font-size:16px; margin:0 0 4px; color:#1e293b; }
  .subtitle { font-size:11px; color:#94a3b8; margin-bottom:8px; }
  .section { border:1px solid #e2e8f0; border-radius:10px; padding:10px; }
  .section-title { font-size:13px; font-weight:700; color:#334155; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  label { font-size:12px; color:#475569; }
  input[type=text], input[type=number], select {
    width:100%; padding:7px 8px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; margin-top:3px;
  }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  button {
    cursor:pointer; border:1px solid #cbd5e1; background:#fff; border-radius:6px;
    padding:8px 10px; font-size:13px; transition:.15s;
  }
  button:hover { background:#f1f5f9; }
  button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
  button.primary:hover { background:#1d4ed8; }
  button.danger { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  button.danger:hover { background:#fee2e2; }
  button.active { background:#dcfce7; border-color:#22c55e; color:#166534; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .btn-small { padding:5px 9px; font-size:12px; }
  .checkbox-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; }
  .checkbox-grid label { display:flex; align-items:center; gap:5px; cursor:pointer; }

  /* 多邊形清單（手繪 / 匯入為可編輯多邊形） */
  .polygon-item {
    display:flex; align-items:center; justify-content:space-between; padding:7px 8px;
    border-radius:6px; cursor:pointer; font-size:12px; margin-bottom:4px; border:1px solid transparent;
  }
  .polygon-item:hover { background:#f8fafc; }
  .polygon-item.selected { background:#eff6ff; border-color:#93c5fd; }
  .polygon-item-info { display:flex; align-items:center; gap:8px; overflow:hidden; }
  .polygon-item-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .polygon-item-actions { display:flex; gap:4px; flex-shrink:0; }
  .polygon-item-btn { border:none; background:transparent; padding:2px 5px; font-size:12px; }
  .polygon-rename-btn:hover { color:#2563eb; }
  .polygon-delete-btn:hover { color:#dc2626; }
  .polygon-rename-input { width:100%; padding:2px 4px; font-size:12px; border:1px solid #93c5fd; border-radius:4px; }

  /* ★ 新增：GeoJSON 參考圖層欄位選擇 面板 */
  .field-selector-panel {
    display:none; flex-direction:column; gap:8px; padding:10px;
    background:#f8fafc; border:1px dashed #94a3b8; border-radius:8px;
  }
  .field-selector-row { display:flex; gap:6px; align-items:center; }
  .field-selector-row select { flex:1; }

  /* ★ 新增：GeoJSON 參考圖層 面圖徵清單 */
  .geojson-list-item {
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
    cursor:pointer; font-size:12px; margin-bottom:3px;
  }
  .geojson-list-item:hover { background:#f8fafc; }
  .geojson-list-item.selected { background:#fef2f2; border:1px solid #fca5a5; }

  /* ★ 新增：地圖上顯示於多邊形內部的欄位標籤樣式 */
  .geojson-field-label {
    background: rgba(255,255,255,0.92) !important;
    border: 1px solid #1e293b !important;
    border-radius: 5px !important;
    padding: 2px 7px !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    color: #1e293b !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .leaflet-tooltip.geojson-field-label::before { display:none !important; }

  .edit-handle { width:12px; height:12px; background:#fff; border:2px solid #2563eb; border-radius:50%; }

  #resultPanel {
    position:fixed; top:80px; right:20px; width:520px; max-height:70vh; background:#fff;
    border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.25); display:flex; flex-direction:column;
    overflow:hidden; z-index:9000;
  }
  #resultPanel.hidden, #routeCard.hidden { display:none; }
  #resultHeader {
    background:#1e293b; color:#fff; padding:10px 14px; display:flex; justify-content:space-between;
    align-items:center; cursor:move; font-size:13px; font-weight:600;
  }
  #resultHeader button { background:transparent; border:none; color:#fff; font-size:16px; }
  #resultBody { padding:10px 14px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:6px 8px; border-bottom:1px solid #e2e8f0; text-align:left; }
  th { cursor:pointer; background:#f8fafc; position:sticky; top:0; }
  tr.highlight { background:#fef9c3; }
  tr:hover { background:#f8fafc; }

  #routeCard {
    position:fixed; bottom:20px; right:20px; background:#fff; padding:12px 16px; border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.2); font-size:13px; z-index:9000;
  }

  .toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff;
    padding:10px 18px; border-radius:8px; font-size:13px; z-index:99999; animation:fadeInOut 3s ease;
  }
  @keyframes fadeInOut {
    0% { opacity:0; transform:translate(-50%,10px); }
    10%, 90% { opacity:1; transform:translate(-50%,0); }
    100% { opacity:0; transform:translate(-50%,-10px); }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div>
      <h1>市價徵收查估作業系統</h1>
      <div class="subtitle">v1.1.0 Enhanced TWD97 Edition</div>
    </div>

    <div class="section">
      <div class="section-title">📍 查詢原點</div>
      <div class="row">
        <div><label>緯度</label><input type="text" id="latInput" value="25.0330"></div>
        <div><label>經度</label><input type="text" id="lonInput" value="121.5654"></div>
      </div>
      <div style="margin-top:8px;"><label>搜尋半徑（公尺，上限 3000）</label>
        <input type="number" id="radiusInput" value="1000" max="3000"></div>
      <div style="margin-top:8px; display:flex; gap:6px;">
        <button onclick="getCurrentLocation()">🛰 使用目前位置</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🔎 分析類型</div>
      <div class="checkbox-grid">
        <label><input type="checkbox" value="station" checked> 車站</label>
        <label><input type="checkbox" value="bus_stop"> 公車站</label>
        <label><input type="checkbox" value="motorway_junction"> 交流道</label>
        <label><input type="checkbox" value="parking"> 停車場</label>
        <label><input type="checkbox" value="marketplace"> 市場/超市</label>
        <label><input type="checkbox" value="waste_disposal"> 垃圾轉運站</label>
        <label><input type="checkbox" value="park"> 公園</label>
        <label><input type="checkbox" value="tourism"> 觀光景點</label>
        <label><input type="checkbox" value="bank"> 金融/醫療</label>
        <label><input type="checkbox" value="cemetery"> 墓地</label>
        <label><input type="checkbox" value="school"> 學校</label>
        <label><input type="checkbox" value="gas"> 變電所</label>
        <label><input type="checkbox" value="pollution"> 污水處理廠</label>
      </div>
      <button class="primary" style="width:100%; margin-top:10px;" id="queryBtn" onclick="runQuery()">🔍 查詢分析</button>
    </div>

    <div class="section">
      <div class="section-title">✏️ 手繪多邊形</div>
      <div style="display:flex; gap:6px;">
        <button id="btn-draw-mode" onclick="startDrawing()">開始繪製</button>
        <button id="btn-end-draw" style="display:none;" onclick="finishPolygon()">結束繪製</button>
        <button class="danger" onclick="clearAllPolygons()">清除全部</button>
      </div>
      <div style="margin-top:8px; display:flex; gap:6px;">
        <button class="btn-small" onclick="exportPolygonsToGeoJSON()">⬇ 匯出 GeoJSON</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📂 匯入為可編輯多邊形（SHP / GeoJSON）</div>
      <input type="file" id="shp-file-input" accept=".geojson,.json,.zip" onchange="importPolygonsFromSHP(event)">
      <div style="font-size:11px; color:#94a3b8; margin-top:6px;">支援 TWD97/WGS84 自動偵測轉換，匯入後可編輯/拖曳頂點</div>
    </div>

    <!-- ★★★ 新增功能：匯入 GeoJSON 參考圖層 ＋ 欄位標籤選擇 ★★★ -->
    <div class="section">
      <div class="section-title">🗺️ 匯入 GeoJSON 參考圖層（可選擇顯示欄位）</div>
      <input type="file" id="geojson-reference-input" accept=".geojson,.json">
      <div style="font-size:11px; color:#94a3b8; margin:6px 0;">
        載入後可從下方選單挑選 JSON 屬性欄位，該欄位的值將以標籤顯示在<b>每個多邊形內部</b>
      </div>

      <div class="field-selector-panel" id="geoJsonFieldPanel">
        <label>📌 顯示欄位標籤</label>
        <div class="field-selector-row">
          <select id="geoJsonFieldSelect" onchange="onGeoJSONFieldChange(this.value)">
            <option value="">-- 不顯示標籤 --</option>
          </select>
          <button class="btn-small" onclick="clearGeoJSONFieldLabels()">清除</button>
        </div>
      </div>

      <div id="geoJsonLayerList" style="margin-top:8px; max-height:180px; overflow-y:auto;">
        <div style="padding:8px;color:#999;font-size:12px;">尚未載入參考圖層</div>
      </div>
      <div style="margin-top:6px;">
        <button class="btn-small danger" onclick="clearAllGeoJSONReferenceLayers()">移除所有參考圖層</button>
      </div>
    </div>
    <!-- ★★★ 新增功能結束 ★★★ -->

    <div class="section" style="flex:1;">
      <div class="section-title">📋 多邊形清單 (<span id="polyCount">0</span>)</div>
      <div id="polygonList">
        <div style="padding:8px;color:#999;font-size:12px;">尚無多邊形 - 點擊工具列開始繪製</div>
      </div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div id="resultPanel" class="hidden">
  <div id="resultHeader">
    <span>📊 查詢結果</span>
    <div>
      <button class="btn-small" style="color:#fff;" onclick="exportExcel()">⬇ Excel</button>
      <button onclick="document.getElementById('resultPanel').classList.add('hidden')">✕</button>
    </div>
  </div>
  <div id="resultBody">
    <table>
      <thead>
        <tr>
          <th>名稱</th>
          <th>類型</th>
          <th onclick="sortResults('distance')">直線距離(m) ⇅</th>
          <th onclick="sortResults('route')">路線距離 ⇅</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="routeCard" class="hidden">
  🚗 路線距離：<span id="routeInfo">尚未計算</span>
  <button class="btn-small" style="margin-left:8px;" onclick="clearRoute()">清除路線</button>
</div>

<script>
/* ========================================================================
   全域變數與地圖初始化
   ======================================================================== */
const map = L.map('map', { zoomControl: true }).setView([25.0330, 121.5654], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

const latInput = document.getElementById('latInput');
const lonInput = document.getElementById('lonInput');
const radiusInput = document.getElementById('radiusInput');
const queryBtn = document.getElementById('queryBtn');
const resultPanel = document.getElementById('resultPanel');
const routeCard = document.getElementById('routeCard');
const routeInfo = document.getElementById('routeInfo');
const tbody = document.getElementById('tbody');

const markerLayer = L.layerGroup().addTo(map);
const drawMarkers = L.layerGroup().addTo(map);

let origin = [parseFloat(latInput.value), parseFloat(lonInput.value)];
let results = [];
let routeLayer = null;
let sortState = { distance: true, route: true };

let isDrawingPolygon = false;
let drawPoints = [];
let previewPolyline = null;

let polygons = [];
let polygonIdCounter = 0;
let currentPolygonId = null;
let renameCancelled = false;

const polygonColors = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

/* ========================================================================
   TWD97 (EPSG:3826) ↔ WGS84 座標轉換引擎
   Transverse Mercator, a=6378137.0, f=1/298.257222101, k0=0.9999
   ======================================================================== */

function isTWD97Coordinate(x, y) {
    return x > 100000 && x < 400000 && y > 2000000 && y < 2900000;
}

function twd97ToWGS84(x, y) {
    const a = 6378137.0;
    const f = 1 / 298.257222101;
    const b = a * (1 - f);
    const e2 = (a * a - b * b) / (a * a);
    const k0 = 0.9999;
    const dx = 250000;
    const lon0 = 121 * Math.PI / 180;

    const M = y / k0;
    const mu = M / (a * (1 - e2/4 - 3*e2*e2/64 - 5*e2*e2*e2/256));

    const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
    const J1 = (3*e1/2 - 27*e1*e1*e1/32);
    const J2 = (21*e1*e1/16 - 55*e1*e1*e1*e1/32);
    const J3 = (151*e1*e1*e1/96);
    const J4 = (1097*e1*e1*e1*e1/512);

    const fp = mu + J1*Math.sin(2*mu) + J2*Math.sin(4*mu) + J3*Math.sin(6*mu) + J4*Math.sin(8*mu);

    const e2p = e2 / (1 - e2);
    const C1 = e2p * Math.pow(Math.cos(fp), 2);
    const T1 = Math.pow(Math.tan(fp), 2);
    const R1 = a * (1 - e2) / Math.pow(1 - e2*Math.pow(Math.sin(fp),2), 1.5);
    const N1 = a / Math.sqrt(1 - e2*Math.pow(Math.sin(fp),2));
    const D = (x - dx) / (N1 * k0);

    const lat = fp - (N1*Math.tan(fp)/R1) * (
        D*D/2 -
        (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2p) * Math.pow(D,4)/24 +
        (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2p - 3*C1*C1) * Math.pow(D,6)/720
    );

    const lon = lon0 + (
        D - (1 + 2*T1 + C1) * Math.pow(D,3)/6 +
        (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2p + 24*T1*T1) * Math.pow(D,5)/120
    ) / Math.cos(fp);

    return [lon * 180 / Math.PI, lat * 180 / Math.PI];
}

/* ========================================================================
   GeoJSON 通用處理：normalizeGeoJSON / deepTransformGeoJSON / explodeMultiPolygons
   ======================================================================== */

function normalizeGeoJSON(raw) {
    let data = raw;
    let guard = 0;
    while (data && data.type === 'FeatureCollection' && data.features &&
           !Array.isArray(data.features) && guard < 5) {
        data = data.features;
        guard++;
    }
    if (Array.isArray(data)) {
        let allFeatures = [];
        data.forEach(item => {
            if (item && item.type === 'FeatureCollection') allFeatures.push(...(item.features || []));
            else if (item && item.type === 'Feature') allFeatures.push(item);
        });
        return { type: 'FeatureCollection', features: allFeatures };
    }
    if (data.type === 'FeatureCollection') return data;
    if (data.type === 'Feature') return { type: 'FeatureCollection', features: [data] };
    if (data.type && data.coordinates) {
        return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: data, properties: {} }] };
    }
    return data;
}

function deepTransformGeoJSON(geojson) {
    const clone = JSON.parse(JSON.stringify(geojson));
    function transformCoordArray(coords) {
        if (typeof coords[0] === 'number') {
            if (isTWD97Coordinate(coords[0], coords[1])) {
                return twd97ToWGS84(coords[0], coords[1]);
            }
            return coords;
        }
        return coords.map(transformCoordArray);
    }
    (clone.features || []).forEach(f => {
        if (f.geometry && f.geometry.coordinates) {
            f.geometry.coordinates = transformCoordArray(f.geometry.coordinates);
        }
    });
    return clone;
}

function explodeMultiPolygons(geojson) {
    const exploded = { type: 'FeatureCollection', features: [] };
    (geojson.features || []).forEach(f => {
        if (f.geometry && f.geometry.type === 'MultiPolygon') {
            f.geometry.coordinates.forEach((polyCoords, idx) => {
                exploded.features.push({
                    type: 'Feature',
                    geometry: { type: 'Polygon', coordinates: polyCoords },
                    properties: { ...f.properties, __multiIndex: idx }
                });
            });
        } else if (f.geometry && f.geometry.type === 'Polygon') {
            exploded.features.push(f);
        }
    });
    return exploded;
}

/* ========================================================================
   色彩處理：lightenColor / extractStyleFromProperties / defaultGeoJSONStyle
   ======================================================================== */

function lightenColor(hex, percent = 0.86) {
    if (!hex || typeof hex !== 'string') return '#93c5fd';
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    if (hex.length !== 6 || /[^0-9a-fA-F]/.test(hex)) return '#93c5fd';
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    const nr = Math.round(r + (255 - r) * percent);
    const ng = Math.round(g + (255 - g) * percent);
    const nb = Math.round(b + (255 - b) * percent);
    return `#${nr.toString(16).padStart(2, '0')}${ng.toString(16).padStart(2, '0')}${nb.toString(16).padStart(2, '0')}`;
}

function extractStyleFromProperties(props) {
    props = props || {};
    const rawColor = props.color || props.stroke || props.fill || props.COLOR || '#3b82f6';
    const fillColor = lightenColor(rawColor, 0.86);
    return { strokeColor: rawColor, fillColor: fillColor };
}

function defaultGeoJSONStyle(feature) {
    const s = extractStyleFromProperties(feature.properties);
    return { color: s.strokeColor, weight: 2, fillColor: s.fillColor, fillOpacity: 0.55, opacity: 0.9 };
}

function selectedGeoJSONStyle(feature) {
    const s = extractStyleFromProperties(feature.properties);
    return { color: '#dc2626', weight: 4, fillColor: s.fillColor, fillOpacity: 0.65, opacity: 1 };
}

/* ========================================================================
   ★★★ 新增功能核心：GeoJSON 參考圖層子系統
   （匯入 GeoJSON → 個別面選取 → 選擇顯示欄位 → 於多邊形內顯示標籤）
   ======================================================================== */

let importedGeoJSONLayers = {};      // { layerName: L.geoJSON 圖層群組 }
let geoJsonFeaturesRegistry = [];    // [{ layerName, feature, layer }]
let geoJsonSelection = {};           // { featureKey: leafletLayer } 目前高亮選取
let activeGeoJSONSelection = null;   // { layerName, feature, layer } 查詢原點使用
let geoJsonAllFieldKeys = [];        // 所有已載入圖層的屬性欄位聯集
let geoJsonLabelField = null;        // 目前選擇要顯示的欄位名稱

function loadGeoJSONReferenceLayer(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const raw = JSON.parse(e.target.result);
            const normalized = normalizeGeoJSON(raw);
            const transformed = deepTransformGeoJSON(normalized);
            const exploded = explodeMultiPolygons(transformed);
            if (!exploded.features || exploded.features.length === 0) {
                showToast('❌ 檔案中未偵測到有效的 Polygon/MultiPolygon');
                return;
            }
            const layerName = file.name.replace(/\.[^.]+$/, '') + '_' + Date.now();
            addGeoJSONReferenceLayer(layerName, exploded);
        } catch (err) {
            console.error('❌ GeoJSON 讀取失敗:', err);
            showToast('❌ GeoJSON 讀取失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function addGeoJSONReferenceLayer(layerName, geojson) {
    const leafletLayer = L.geoJSON(geojson, {
        style: defaultGeoJSONStyle,
        onEachFeature: (feature, layer) => {
            const featureKey = layerName + '_f' + geoJsonFeaturesRegistry.length;
            feature.properties = feature.properties || {};
            feature.properties.__featureKey = featureKey;
            geoJsonFeaturesRegistry.push({ layerName, feature, layer });

            layer.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                toggleGeoJSONFeatureSelection(layerName, feature, layer);
            });
        }
    }).addTo(map);

    importedGeoJSONLayers[layerName] = leafletLayer;

    updateGeoJSONFieldSelector();
    applyGeoJSONFieldLabels();
    buildPolygonListPanel();

    try { map.fitBounds(leafletLayer.getBounds(), { maxZoom: 17 }); } catch (err) {}
    showToast(`✅ 已載入參考圖層，共 ${geojson.features.length} 個面`);
}

function clearAllGeoJSONReferenceLayers() {
    if (Object.keys(importedGeoJSONLayers).length === 0) {
        showToast('目前無參考圖層');
        return;
    }
    if (!confirm('確定要移除所有已匯入的 GeoJSON 參考圖層嗎？')) return;

    Object.values(importedGeoJSONLayers).forEach(layer => map.removeLayer(layer));
    importedGeoJSONLayers = {};
    geoJsonFeaturesRegistry = [];
    geoJsonSelection = {};
    activeGeoJSONSelection = null;
    geoJsonAllFieldKeys = [];
    geoJsonLabelField = null;

    updateGeoJSONFieldSelector();
    buildPolygonListPanel();
    showToast('✕ 已移除所有參考圖層');
}

/* ---- 個別面選取（含互斥手繪多邊形選取、自動更新查詢原點） ---- */

function toggleGeoJSONFeatureSelection(layerName, feature, layer) {
    const key = feature.properties.__featureKey;

    // 若點擊已選取的面 → 取消選取
    if (geoJsonSelection[key]) {
        delete geoJsonSelection[key];
        applyGeoJSONFeatureStyle(layer, feature, false);
        if (activeGeoJSONSelection && activeGeoJSONSelection.feature === feature) {
            activeGeoJSONSelection = null;
        }
        buildPolygonListPanel();
        return;
    }

    // ★ 互斥：清除手繪多邊形的選取，避免查詢原點衝突
    if (currentPolygonId) {
        const prevPoly = polygons.find(p => p.id === currentPolygonId);
        currentPolygonId = null;
        if (prevPoly) {
            prevPoly.isSelected = false;
            renderPolygonLayer(prevPoly);
        }
        renderPolygonList();
    }

    // 清除先前選取的 GeoJSON 面（維持單一有效查詢原點）
    Object.keys(geoJsonSelection).forEach(k => {
        const prevEntry = geoJsonFeaturesRegistry.find(r => r.feature.properties.__featureKey === k);
        if (prevEntry) applyGeoJSONFeatureStyle(prevEntry.layer, prevEntry.feature, false);
    });
    geoJsonSelection = {};

    geoJsonSelection[key] = layer;
    applyGeoJSONFeatureStyle(layer, feature, true);
    activeGeoJSONSelection = { layerName, feature, layer };

    // ★ 自動以 turf.centroid 更新查詢原點
    try {
        const centroid = turf.centroid(feature);
        const lon = centroid.geometry.coordinates[0];
        const lat = centroid.geometry.coordinates[1];
        latInput.value = lat.toFixed(6);
        lonInput.value = lon.toFixed(6);
        origin = [lat, lon];
    } catch (err) {
        console.error('形心計算失敗:', err);
    }

    buildPolygonListPanel();
    const label = getDisplayLabelForFeature(feature) || key;
    showToast('✓ 已選取匯入圖層面：' + label);
}

function applyGeoJSONFeatureStyle(layer, feature, isSelected) {
    const style = isSelected ? selectedGeoJSONStyle(feature) : defaultGeoJSONStyle(feature);
    layer.setStyle(style);
    if (isSelected) layer.bringToFront();
}

/* ---- ★★★ 欄位選擇與標籤顯示（本次新增主功能） ★★★ ---- */

function updateGeoJSONFieldSelector() {
    const keySet = new Set();
    geoJsonFeaturesRegistry.forEach(entry => {
        Object.keys(entry.feature.properties || {}).forEach(k => {
            if (!k.startsWith('__')) keySet.add(k);
        });
    });
    geoJsonAllFieldKeys = Array.from(keySet).sort();

    const panel = document.getElementById('geoJsonFieldPanel');
    const select = document.getElementById('geoJsonFieldSelect');
    if (!panel || !select) return;

    if (geoJsonAllFieldKeys.length === 0) {
        panel.style.display = 'none';
        select.innerHTML = '<option value="">-- 不顯示標籤 --</option>';
        geoJsonLabelField = null;
        return;
    }

    panel.style.display = 'flex';
    const current = geoJsonLabelField || '';
    select.innerHTML = '<option value="">-- 不顯示標籤 --</option>' +
        geoJsonAllFieldKeys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
    select.value = geoJsonAllFieldKeys.includes(current) ? current : '';
}

function onGeoJSONFieldChange(fieldName) {
    geoJsonLabelField = fieldName || null;
    applyGeoJSONFieldLabels();
    buildPolygonListPanel();
    showToast(fieldName ? `✓ 已套用欄位標籤：${fieldName}` : '已清除欄位標籤');
}

function clearGeoJSONFieldLabels() {
    geoJsonLabelField = null;
    const select = document.getElementById('geoJsonFieldSelect');
    if (select) select.value = '';
    applyGeoJSONFieldLabels();
    buildPolygonListPanel();
    showToast('✓ 已清除所有欄位標籤');
}

// 將目前選擇的欄位值，以置中永久標籤方式顯示在每個多邊形內部
function applyGeoJSONFieldLabels() {
    geoJsonFeaturesRegistry.forEach(entry => {
        const { feature, layer } = entry;
        if (layer.getTooltip && layer.getTooltip()) {
            layer.unbindTooltip();
        }
        if (!geoJsonLabelField) return;

        const value = feature.properties ? feature.properties[geoJsonLabelField] : undefined;
        if (value === undefined || value === null || String(value).trim() === '') return;

        try {
            layer.bindTooltip(String(value), {
                permanent: true,
                direction: 'center',
                className: 'geojson-field-label',
                opacity: 0.95
            });
            if (map.hasLayer(layer)) layer.openTooltip();
        } catch (err) {
            console.warn('標籤綁定失敗:', err);
        }
    });
}

function getDisplayLabelForFeature(feature) {
    if (geoJsonLabelField && feature.properties && feature.properties[geoJsonLabelField] !== undefined) {
        return feature.properties[geoJsonLabelField];
    }
    return feature.properties?.name || feature.properties?.NAME || feature.properties?.['名稱'] || null;
}

/* ---- 側邊欄清單（buildPolygonListPanel：GeoJSON 面清單，含雙向同步） ---- */

function buildPolygonListPanel() {
    const container = document.getElementById('geoJsonLayerList');
    if (!container) return;

    if (geoJsonFeaturesRegistry.length === 0) {
        container.innerHTML = '<div style="padding:8px;color:#999;font-size:12px;">尚未載入參考圖層</div>';
        return;
    }

    container.innerHTML = geoJsonFeaturesRegistry.map(entry => {
        const key = entry.feature.properties.__featureKey;
        const isSelected = !!geoJsonSelection[key];
        const style = extractStyleFromProperties(entry.feature.properties);
        const label = getDisplayLabelForFeature(entry.feature) || key;
        return `<div class="geojson-list-item ${isSelected ? 'selected' : ''}" onclick="focusGeoJSONFeature('${key}')">
                    <div style="width:12px;height:12px;background:${style.strokeColor};border-radius:2px;flex-shrink:0;"></div>
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(String(label))}</span>
                </div>`;
    }).join('');
}

function focusGeoJSONFeature(key) {
    const entry = geoJsonFeaturesRegistry.find(r => r.feature.properties.__featureKey === key);
    if (!entry) return;
    if (!geoJsonSelection[key]) {
        toggleGeoJSONFeatureSelection(entry.layerName, entry.feature, entry.layer);
    }
    try { map.fitBounds(entry.layer.getBounds(), { maxZoom: 18 }); } catch (err) {}
}

/* ========================================================================
   Module E：window.geoCache（LocalStorage 持久化，2000ms 防抖自動儲存）
   ======================================================================== */

window.geoCache = (function () {
    const STORAGE_KEY = 'marketValueAppraisal_geoCache_v1';
    let saveTimer = null;

    function serializeState() {
        return {
            polygons: polygons.map(p => ({
                id: p.id, name: p.name, points: p.points, color: p.color,
                originalProperties: p.originalProperties || {}
            })),
            geoJsonLabelField: geoJsonLabelField,
            savedAt: new Date().toISOString()
        };
    }

    function save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
        } catch (err) {
            console.warn('LocalStorage 儲存失敗:', err);
        }
    }

    function debouncedSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 2000);
    }

    function load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (err) {
            console.warn('LocalStorage 讀取失敗:', err);
            return null;
        }
    }

    function clear() {
        localStorage.removeItem(STORAGE_KEY);
    }

    return { save, debouncedSave, load, clear };
})();

/* ========================================================================
   多邊形繪製邏輯
   ======================================================================== */

function startDrawing() {
    isDrawingPolygon = true;
    drawPoints = [];
    drawMarkers.clearLayers();
    if (previewPolyline) map.removeLayer(previewPolyline);
    document.getElementById('btn-draw-mode').classList.add('active');
    document.getElementById('btn-end-draw').style.display = 'block';
    showToast('開始繪製多邊形，點擊地圖添加頂點');
}

function finishPolygon() {
    if (drawPoints.length < 3) {
        alert('請至少點選 3 個以上的頂點！');
        return;
    }
    createPolygonObject(drawPoints);
    drawPoints = [];
    isDrawingPolygon = false;
    document.getElementById('btn-draw-mode').classList.remove('active');
    document.getElementById('btn-end-draw').style.display = 'none';
    drawMarkers.clearLayers();
    if (previewPolyline) map.removeLayer(previewPolyline);
    showToast('✓ 多邊形已完成');
}

function createPolygonObject(points, customName) {
    const id = 'poly_' + Date.now() + '_' + (polygonIdCounter++);
    const colorIndex = polygons.length % polygonColors.length;
    const color = polygonColors[colorIndex];

    const defaultName = `多邊形 ${polygons.length + 1}`;
    const finalName = (customName && String(customName).trim()) ? String(customName).trim() : defaultName;

    const polygonObj = {
        id: id,
        name: finalName,
        points: [...points],
        layer: null,
        markers: L.layerGroup(),
        isEditing: false,
        centroid: null,
        isSelected: false,
        color: color,
        originalProperties: {}
    };

    updatePolygonCentroid(polygonObj);
    renderPolygonLayer(polygonObj);

    polygons.push(polygonObj);
    selectPolygon(id);
    renderPolygonList();
    window.geoCache.debouncedSave();
    return polygonObj;
}

function updatePolygonCentroid(polygonObj) {
    if (!polygonObj.points || polygonObj.points.length < 3) return;
    let coordinates = polygonObj.points.map(p => [p[1], p[0]]);
    if (coordinates[0][0] !== coordinates[coordinates.length-1][0] ||
        coordinates[0][1] !== coordinates[coordinates.length-1][1]) {
        coordinates.push([polygonObj.points[0][1], polygonObj.points[0][0]]);
    }
    let turfPoly = turf.polygon([coordinates]);
    let centroid = turf.centroid(turfPoly);
    polygonObj.centroid = [centroid.geometry.coordinates[1], centroid.geometry.coordinates[0]];
}

function renderPolygonLayer(polygonObj) {
    if (polygonObj.layer) map.removeLayer(polygonObj.layer);
    const style = {
        color: polygonObj.color,
        weight: polygonObj.isSelected ? 4 : 3,
        fillColor: polygonObj.color,
        fillOpacity: 0.25,
        dashArray: polygonObj.isSelected ? null : '5,5'
    };
    polygonObj.layer = L.polygon(polygonObj.points, style).addTo(map);

    polygonObj.layer.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        if (isDrawingPolygon) return;
        selectPolygon(polygonObj.id);
    });

    if (polygonObj.isEditing || polygonObj.isSelected) {
        renderEditHandles(polygonObj);
    } else {
        polygonObj.markers.clearLayers();
    }
}

function renderEditHandles(polygonObj) {
    polygonObj.markers.clearLayers();
    polygonObj.points.forEach((pt, index) => {
        let marker = L.marker(pt, {
            icon: L.divIcon({
                className: '',
                html: '<div class="edit-handle"></div>',
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            }),
            draggable: true
        });

        marker.on('drag', (e) => {
            let newLatLng = e.target.getLatLng();
            polygonObj.points[index] = [newLatLng.lat, newLatLng.lng];
            polygonObj.layer.setLatLngs(polygonObj.points);
        });

        marker.on('dragend', () => {
            updatePolygonCentroid(polygonObj);
            updateLatLonInputs(polygonObj);
            renderPolygonLayer(polygonObj);
            window.geoCache.debouncedSave();
        });

        marker.addTo(polygonObj.markers);
    });
    polygonObj.markers.addTo(map);
}

/* ========================================================================
   ★ selectPolygon（手繪多邊形選取）
   選取手繪多邊形時，自動取消所有匯入 GeoJSON 圖層的選取狀態，
   避免與 activeGeoJSONSelection 同時存在造成查詢原點衝突
   ======================================================================== */

function selectPolygon(id) {
    if (Object.keys(geoJsonSelection).length > 0) {
        Object.keys(geoJsonSelection).forEach(key => {
            const entry = geoJsonFeaturesRegistry.find(r => r.feature.properties.__featureKey === key);
            delete geoJsonSelection[key];
            if (entry) applyGeoJSONFeatureStyle(entry.layer, entry.feature, false);
        });
        activeGeoJSONSelection = null;
        buildPolygonListPanel();
    }

    polygons.forEach(p => {
        const wasSelected = p.isSelected;
        p.isSelected = (p.id === id);
        if (wasSelected && !p.isSelected) {
            renderPolygonLayer(p);
        }
    });

    const polygon = polygons.find(p => p.id === id);
    if (!polygon) return;

    currentPolygonId = id;
    renderPolygonLayer(polygon);
    renderEditHandles(polygon);
    renderPolygonList();
    updateLatLonInputs(polygon);
}

function deletePolygon(id) {
    const index = polygons.findIndex(p => p.id === id);
    if (index < 0) return;

    const polygon = polygons[index];
    if (polygon.layer) map.removeLayer(polygon.layer);
    if (polygon.markers) polygon.markers.clearLayers();

    polygons.splice(index, 1);
    if (currentPolygonId === id) currentPolygonId = null;

    renderPolygonList();
    window.geoCache.debouncedSave();
    showToast('多邊形已刪除');
}

function clearAllPolygons() {
    if (!confirm('確定要清除所有多邊形嗎？')) return;
    polygons.forEach(p => {
        if (p.layer) map.removeLayer(p.layer);
        if (p.markers) p.markers.clearLayers();
    });
    polygons = [];
    currentPolygonId = null;
    renderPolygonList();
    window.geoCache.debouncedSave();
    showToast('✕ 所有多邊形已清除');
}

function updateLatLonInputs(polygonObj) {
    if (!polygonObj.centroid) return;
    latInput.value = polygonObj.centroid[0].toFixed(6);
    lonInput.value = polygonObj.centroid[1].toFixed(6);
    origin = [...polygonObj.centroid];
}

function startRenamePolygon(id) {
    const nameDiv = document.getElementById('name-' + id);
    const poly = polygons.find(p => p.id === id);
    if (!nameDiv || !poly) return;

    nameDiv.innerHTML = `<input type="text" class="polygon-rename-input" id="rename-input-${id}"
        value="${escapeHtml(poly.name)}"
        onclick="event.stopPropagation();"
        onkeydown="handleRenameKeydown(event, '${id}')"
        onblur="finishRenamePolygon('${id}', this.value)">`;

    const input = document.getElementById('rename-input-' + id);
    if (input) {
        input.focus();
        input.select();
    }
}

function handleRenameKeydown(e, id) {
    if (e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
    } else if (e.key === 'Escape') {
        e.preventDefault();
        renameCancelled = true;
        renderPolygonList();
    }
}

function finishRenamePolygon(id, newValue) {
    if (renameCancelled) {
        renameCancelled = false;
        return;
    }
    const poly = polygons.find(p => p.id === id);
    if (!poly) return;

    const trimmed = (newValue || '').trim();
    if (trimmed) {
        poly.name = trimmed;
        showToast('✓ 名稱已更新');
        window.geoCache.debouncedSave();
    }
    renderPolygonList();
}

function renderPolygonList() {
    const listDiv = document.getElementById('polygonList');
    const countSpan = document.getElementById('polyCount');
    countSpan.innerText = polygons.length;

    if (polygons.length === 0) {
        listDiv.innerHTML = '<div style="padding:8px;color:#999;font-size:12px;">尚無多邊形 - 點擊工具列開始繪製</div>';

/* ========================================================================
   距離和路網分析
   ======================================================================== */

function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function calculateBearing(lat1, lon1, lat2, lon2) {
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function scoreEntrance(candidate) {
    const tags = candidate.tags || {};
    let score = 0;

    if (tags.highway === "motorway_link") score += 40;
    else return 0;

    if (tags.oneway === "yes") score += 20;
    if (tags.destination) score += 10;
    if (tags["destination:ref"]) score += 8;
    if (tags.ref) score += 5;
    if (tags.motorroad === "yes") score += 5;
    if (tags.lanes) score += 3;
    if (tags.bridge === "yes") score += 2;
    if (tags.layer) score += 2;

    if (tags.access === "private") score -= 50;
    if (tags.access === "no") score -= 100;
    if (tags.service) score -= 20;
    if (tags.area === "yes") score -= 100;
    if (tags.highway === "construction") score -= 100;

    if (tags.name) score += 3;

    if (tags.destination || tags.name) {
        const text = (tags.destination || "") + " " + (tags.name || "");
        if (text.includes("出口") || text.includes("Exit") || text.includes("off-ramp") || tags.exit_to) score -= 80;
        if (text.includes("國道") || text.includes("Freeway") || text.includes("高速公路") || text.includes("入口") || text.includes("Entrance") || text.includes("on-ramp")) score += 30;
    }

    score = Math.max(0, Math.min(score, 100));
    return score;
}

async function buildEntranceCandidates(junction) {
    const SEARCH_RADIUS = 1000;
    const lat = junction[0];
    const lon = junction[1];
    const query = `[out:json][timeout:25]; (way["highway"="motorway_link"](around:${SEARCH_RADIUS},${lat},${lon});); out body; >; out skel qt;`;

    try {
        const res = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "data=" + encodeURIComponent(query)
        });
        const data = await res.json();
        if (!data.elements) return [];

        const nodeMap = new Map();
        data.elements.filter(e => e.type === "node").forEach(n => {
            nodeMap.set(n.id, { lat: n.lat, lon: n.lon });
        });

        const candidates = [];
        data.elements.filter(e => e.type === "way").forEach(w => {
            if (!w.nodes || w.nodes.length < 2) return;
            const firstNode = nodeMap.get(w.nodes[0]);
            if (!firstNode) return;
            const secondNode = nodeMap.get(w.nodes[1]);
            let bearing = null;
            if (secondNode) bearing = calculateBearing(firstNode.lat, firstNode.lon, secondNode.lat, secondNode.lon);
            const score = scoreEntrance({ tags: w.tags || {} });
            candidates.push({
                wayId: w.id,
                coordinate: [firstNode.lat, firstNode.lon],
                bearing,
                score,
                tags: w.tags || {}
            });
        });

        candidates.sort((a, b) => b.score - a.score);
        return candidates;
    } catch (err) {
        console.error("Candidate Builder Error", err);
        return [];
    }
}

async function getRouteDistance(to, straightDist, isJunction = false, isInZone = false) {
    if (isInZone) return { value: 0, isFallback: false, msg: "" };
    try {
        if (!origin) return null;
        let url = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${to[1]},${to[0]}?overview=false`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
            return { value: Math.round(data.routes[0].distance), isFallback: false, msg: "" };
        }
        return { value: straightDist, isFallback: true, msg: " (直線)" };
    } catch (err) {
        console.error("OSRM 錯誤:", err);
        return { value: straightDist, isFallback: true, msg: " (直線)" };
    }
}

async function drawRoute(to, item) {
    try {
        if (!origin) return;
        if (item.在範圍內) {
            routeInfo.innerText = "位於範圍內（距離 = 0 m）";
            routeCard.classList.remove('hidden');
            if (routeLayer) map.removeLayer(routeLayer);
            return;
        }

        let isJunction = item.原始類型 === "motorway_junction" || item.原始類型 === "ramp";
        let url = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes?.length) {
            routeInfo.innerText = item.距離 + " m (直線示意)";
            routeCard.classList.remove('hidden');
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline([origin, to], { color: "#ef4444", weight: 3, dashArray: "5,10" }).addTo(map);
            return;
        }

        const route = data.routes[0];
        let routeDist = Math.round(route.distance);
        routeInfo.innerText = routeDist + " m" + (isJunction ? " (至交流道入口)" : "");
        routeCard.classList.remove('hidden');

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(route.geometry, { style: { color: isJunction ? "#059669" : "#3b82f6", weight: 5 } }).addTo(map);
    } catch (err) {
        routeInfo.innerText = "路線服務異常";
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline([origin, to], { color: "#ef4444", weight: 3, dashArray: "5,10" }).addTo(map);
    }
}

function selectItem(item) {
    drawRoute(item.座標, item);
    document.querySelectorAll("#tbody tr").forEach(r => r.classList.remove("highlight"));
    const row = document.querySelector(`#tbody tr[data-id="${item.id}"]`);
    if (row) {
        row.classList.add("highlight");
        row.scrollIntoView({ behavior: "smooth", block: "center" });
    }
}

function selectItemById(id) {
    const item = results.find(r => r.id === id);
    if (!item) return;
    selectItem(item);
}

/* ========================================================================
   主查詢函數
   優先採用「匯入 GeoJSON 選取中的多邊形」作為查詢範圍與原點，
   其次才是手繪多邊形，最後才是手動輸入的經緯度
   ======================================================================== */

async function runQuery() {
    const lat = parseFloat(latInput.value);
    const lon = parseFloat(lonInput.value);
    const radius = parseFloat(radiusInput.value);

    if (radius > 3000) {
        alert("半徑超過 3000m 可能造成系統過慢");
        return;
    }

    queryBtn.disabled = true;
    queryBtn.innerText = "⌛ 檢索中...";
    resultPanel.classList.remove('hidden');

    try {
        markerLayer.clearLayers();
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        routeCard.classList.add('hidden');
        tbody.innerHTML = "";
        results = [];

        let turfZonePolygon = null;
        let centroidForQuery = [lat, lon];

        if (activeGeoJSONSelection && activeGeoJSONSelection.feature && activeGeoJSONSelection.feature.geometry) {
            try {
                const geom = activeGeoJSONSelection.feature.geometry;
                if (geom.type === 'Polygon' || geom.type === 'MultiPolygon') {
                    turfZonePolygon = geom;
                    const centroid = turf.centroid(activeGeoJSONSelection.feature);
                    centroidForQuery = [centroid.geometry.coordinates[1], centroid.geometry.coordinates[0]];
                    console.log('ℹ️ 查詢範圍採用匯入 GeoJSON 多邊形：', activeGeoJSONSelection.layerName);
                }
            } catch (err) {
                console.error('❌ GeoJSON 選取範圍解析失敗，改用手動座標:', err);
            }
        }
        else if (currentPolygonId) {
            const selectedPoly = polygons.find(p => p.id === currentPolygonId);
            if (selectedPoly && selectedPoly.centroid) {
                centroidForQuery = selectedPoly.centroid;
                let ring = selectedPoly.points.map(p => [p[1], p[0]]);
                if (ring.length > 2 && (ring[0][0] !== ring[ring.length-1][0] || ring[0][1] !== ring[ring.length-1][1])) {
                    ring.push(ring[0]);
                }
                if (ring.length >= 4) {
                    turfZonePolygon = turf.polygon([ring]);
                }
            }
        }

        const checkedBoxes = document.querySelectorAll("input[type=checkbox]:checked");
        if (checkedBoxes.length === 0) {
            alert("請至少勾選一個分析類型！");
            queryBtn.disabled = false;
            queryBtn.innerText = "🔍 查詢分析";
            return;
        }

        let parts = [];
        checkedBoxes.forEach(e => {
            let t = e.value;
            if (t === "station") {
                parts.push(`nwr["railway"="station"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["railway"="halt"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["amenity"="bus_station"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "bus_stop") {
                parts.push(`nwr["highway"="bus_stop"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "motorway_junction") {
                parts.push(`node["highway"="motorway_junction"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "parking") {
                parts.push(`nwr["amenity"="parking"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["amenity"="parking_entrance"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "marketplace") {
                parts.push(`nwr["amenity"="marketplace"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["shop"="supermarket"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "waste_disposal") {
                parts.push(`nwr["amenity"="waste_transfer_station"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "park") {
                parts.push(`nwr["leisure"="park"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "tourism") {
                parts.push(`nwr["tourism"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "bank") {
                parts.push(`nwr["amenity"="bank"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["amenity"="post_office"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["amenity"="hospital"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "cemetery") {
                parts.push(`nwr["landuse"="cemetery"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "school") {
                parts.push(`nwr["amenity"="school"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});
                nwr["amenity"="university"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "gas") {
                parts.push(`nwr["power"="substation"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
            else if (t === "pollution") {
                parts.push(`nwr["man_made"="wastewater_treatment_plant"](around:${radius},${centroidForQuery[0]},${centroidForQuery[1]});`);
            }
        });

        const query = `[out:json][timeout:60];(${parts.join("\n")});out center;`;
        const res = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            body: "data=" + encodeURIComponent(query),
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });
        const data = await res.json();

        if (!data.elements) {
            queryBtn.disabled = false;
            queryBtn.innerText = "🔍 查詢分析";
            return;
        }

        let rawSchools = [];
        const dedup = new Set();

        data.elements.forEach(e => {
            let lat2 = e.center?.lat ?? e.lat;
            let lon2 = e.center?.lon ?? e.lon;
            if (lat2 == null || lon2 == null) return;

            const key = `${e.type}-${e.id}`;
            if (dedup.has(key)) return;
            dedup.add(key);

            let rawType = e.tags?.highway || e.tags?.amenity || e.tags?.tourism || e.tags?.shop || e.tags?.railway || "未知";
            let name = e.tags?.name || "";

            if (rawType === "school" || rawType === "university") {
                rawSchools.push({ id: e.id, name: name, lat: lat2, lon: lon2, rawType: rawType });
            } else {
                let typeName = rawType;
                if (rawType === "motorway_junction") typeName = "交流道";

                let inside = false;
                if (turfZonePolygon) {
                    let pt = turf.point([lon2, lat2]);
                    inside = turf.booleanPointInPolygon(pt, turfZonePolygon);
                }

                results.push({
                    id: results.length,
                    名稱: name || typeName,
                    類型: typeName,
                    原始類型: rawType,
                    座標: [lat2, lon2],
                    在範圍內: inside,
                    距離: inside ? 0 : Math.round(haversine(centroidForQuery[0], centroidForQuery[1], lat2, lon2)),
                    直線距離顯示: inside ? "0" : Math.round(haversine(centroidForQuery[0], centroidForQuery[1], lat2, lon2)),
                    路線距離: inside ? "0" : "計算中...",
                    路線距離數值: inside ? 0 : null
                });
            }
        });

        rawSchools.forEach(sch => {
            let finalLat = sch.lat;
            let finalLon = sch.lon;

            let inside = false;
            if (turfZonePolygon) {
                let pt = turf.point([finalLon, finalLat]);
                inside = turf.booleanPointInPolygon(pt, turfZonePolygon);
            }

            results.push({
                id: results.length,
                名稱: sch.name || "未命名學校",
                類型: "學校",
                原始類型: sch.rawType,
                座標: [finalLat, finalLon],
                在範圍內: inside,
                距離: inside ? 0 : Math.round(haversine(centroidForQuery[0], centroidForQuery[1], finalLat, finalLon)),
                直線距離顯示: inside ? "0" : Math.round(haversine(centroidForQuery[0], centroidForQuery[1], finalLat, finalLon)),
                路線距離: inside ? "0" : "計算中...",
                路線距離數值: inside ? 0 : null
            });
        });

        for (let item of results) {
            if (item.原始類型 === "motorway_junction") {
                try {
                    const candidates = await buildEntranceCandidates(item.座標);
                    if (candidates && candidates.length > 0) {
                        const bestEntrance = candidates[0];
                        item.座標 = bestEntrance.coordinate;
                        item.類型 = "交流道入口";

                        let inside = false;
                        if (turfZonePolygon) {
                            let pt = turf.point([item.座標[1], item.座標[0]]);
                            inside = turf.booleanPointInPolygon(pt, turfZonePolygon);
                        }
                        item.在範圍內 = inside;
                        item.距離 = inside ? 0 : Math.round(haversine(centroidForQuery[0], centroidForQuery[1], item.座標[0], item.座標[1]));
                        item.直線距離顯示 = inside ? "0" : item.距離;
                    }
                } catch (err) {
                    console.error("交流道搜尋失敗:", err);
                }
            }
        }

        results.sort((a, b) => a.距離 - b.距離);
        renderTable();

        results.forEach(item => {
            const m = L.marker(item.座標).addTo(markerLayer).bindTooltip(item.名稱, { direction: "top" });
            m.on("click", () => {
                map.flyTo(item.座標, 17, { duration: 0.8 });
                selectItem(item);
            });
        });

        queryBtn.innerText = "🚗 計算路線中...";

        for (const item of results.slice(0, 80)) {
            if (item.在範圍內) continue;
            let isJunc = item.原始類型 === "motorway_junction";
            const routeRes = await getRouteDistance(item.座標, item.距離, isJunc, item.在範圍內);
            item.路線距離數值 = routeRes.value;
            item.路線距離 = routeRes.value + " m" + routeRes.msg;
            const cell = document.getElementById(`route-${item.id}`);
            if (cell) cell.innerText = item.路線距離;
        }

    } catch (err) {
        console.error(err);
        alert("查詢發生異常");
    } finally {
        queryBtn.disabled = false;
        queryBtn.innerText = "🔍 查詢分析";
    }
}

function sortResults(type) {
    if (type === "distance") {
        results.sort((a, b) => sortState.distance ? a.距離 - b.距離 : b.距離 - a.距離);
        sortState.distance = !sortState.distance;
    } else if (type === "route") {
        results.sort((a, b) => {
            const ra = a.路線距離數值 ?? 99999999;
            const rb = b.路線距離數值 ?? 99999999;
            return sortState.route ? ra - rb : rb - ra;
        });
        sortState.route = !sortState.route;
    }
    renderTable();
}

function renderTable() {
    tbody.innerHTML = "";
    results.forEach(item => {
        const tr = document.createElement("tr");
        tr.dataset.id = item.id;
        tr.onclick = () => selectItemById(item.id);
        tr.innerHTML = `
            <td>${escapeHtml(item.名稱)}</td>
            <td>${escapeHtml(item.類型)}</td>
            <td>${item.直線距離顯示}</td>
            <td id="route-${item.id}">${item.路線距離}</td>
        `;
        tbody.appendChild(tr);
    });
}

function exportExcel() {
    if (!results.length) { alert("無資料"); return; }
    const ws = XLSX.utils.json_to_sheet(results.map(r => ({
        名稱: r.名稱,
        類型: r.類型,
        直線距離: r.直線距離顯示,
        路線距離: r.路線距離 || ""
    })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "查詢結果");
    XLSX.writeFile(wb, "市價徵收查詢結果.xlsx");
}

/* ========================================================================
   exportPolygonsToGeoJSON 函數
   ======================================================================== */

function exportPolygonsToGeoJSON() {
    if (polygons.length === 0) {
        showToast('❌ 沒有多邊形可匯出');
        return;
    }

    try {
        const features = polygons.map((poly, index) => {
            let ring = poly.points.map(p => [Number(p[1]), Number(p[0])]);
            if (ring.length > 0 &&
                (ring[0][0] !== ring[ring.length - 1][0] ||
                 ring[0][1] !== ring[ring.length - 1][1])) {
                ring.push([Number(poly.points[0][1]), Number(poly.points[0][0])]);
            }

            const turfPoly = turf.polygon([ring]);
            const areaM2 = turf.area(turfPoly);

            const properties = {
                id: poly.id,
                name: poly.name,
                color: poly.color,
                areaM2: Math.round(areaM2),
                areaHa: (areaM2 / 10000).toFixed(4),
                createdAt: new Date().toISOString(),
                exportFormat: 'GeoJSON',
                ...(poly.originalProperties || {})
            };

            return {
                type: 'Feature',
                geometry: {
                    type: 'Polygon',
                    coordinates: [ring]
                },
                properties: properties
            };
        });

        const geoJsonData = {
            type: 'FeatureCollection',
            features: features
        };

        const jsonStr = JSON.stringify(geoJsonData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = url;
        link.download = `polygons-${new Date().toISOString().split('T')[0]}.geojson`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(url);
        showToast(`✓ 已下載 GeoJSON：${link.download}`);
        console.log('✓ GeoJSON 匯出成功，包含 ' + features.length + ' 個多邊形');

    } catch (err) {
        console.error('❌ GeoJSON 匯出失敗:', err);
        showToast('❌ GeoJSON 匯出失敗：' + err.message);
    }
}

/* ========================================================================
   processImportedPolygons 函數（匯入為可編輯多邊形）
   ======================================================================== */

function convertRingIfNeeded(ring) {
    const sample = ring[0];
    if (isTWD97Coordinate(sample[0], sample[1])) {
        return ring.map(coord => twd97ToWGS84(coord[0], coord[1]));
    }
    return ring;
}

function processImportedPolygons(geojson) {
    let data = geojson;

    let guard = 0;
    while (data && data.features && !Array.isArray(data.features) &&
           data.features.type === "FeatureCollection" && guard < 5) {
        console.log(`ℹ️ 展平嵌套層級 ${guard + 1}`);
        data = data.features;
        guard++;
    }

    let features = [];
    if (data.type === "FeatureCollection" && Array.isArray(data.features)) {
        features = data.features;
    } else if (data.type === "Feature") {
        features = [data];
    } else if (data.geometry) {
        features = [{
            type: "Feature",
            geometry: data.geometry,
            properties: data.properties || {}
        }];
    } else {
        showToast("❌ 無效的 GeoJSON 格式");
        console.error('無法識別的結構:', data);
        return;
    }

    let importedCount = 0;
    let skippedCount = 0;
    let convertedCount = 0;

    features.forEach((feature, featureIdx) => {
        if (!feature.geometry) {
            console.warn(`Feature[${featureIdx}] 缺少 geometry，已跳過`);
            skippedCount++;
            return;
        }

        const geomType = feature.geometry.type;
        let polygonsCoords = [];

        if (geomType === "Polygon") {
            if (feature.geometry.coordinates && feature.geometry.coordinates[0]) {
                polygonsCoords.push({
                    ring: feature.geometry.coordinates[0],
                    multiIndex: 0,
                    totalPolygons: 1
                });
            }
        } else if (geomType === "MultiPolygon") {
            feature.geometry.coordinates.forEach((polygonCoords, polyIdx) => {
                if (polygonCoords && polygonCoords[0]) {
                    polygonsCoords.push({
                        ring: polygonCoords[0],
                        multiIndex: polyIdx,
                        totalPolygons: feature.geometry.coordinates.length
                    });
                }
            });
        } else {
            console.warn(`Feature[${featureIdx}] geometry type="${geomType}" 不支援，已跳過`);
            skippedCount++;
            return;
        }

        const props = feature.properties || {};
        const baseName = props.name || props.Name || props.NAME ||
                          props['名稱'] || props.PolyName || null;

        polygonsCoords.forEach((coordData) => {
            const rings = coordData.ring;
            const multiIndex = coordData.multiIndex;
            const totalPolygons = coordData.totalPolygons;

            if (!rings || rings.length < 3) {
                console.warn(`Feature[${featureIdx}].polygon[${multiIndex}] 頂點少於 3 個，已跳過`);
                skippedCount++;
                return;
            }

            const beforeSample = rings[0];
            const wasTWD97 = isTWD97Coordinate(beforeSample[0], beforeSample[1]);
            let convertedRings = rings;
            if (wasTWD97) {
                convertedRings = convertRingIfNeeded(rings);
                convertedCount++;
                console.log(`✓ 自動轉換 Feature[${featureIdx}].polygon[${multiIndex}] 的座標系統 (TWD97 → WGS84)`);
            }

            const invalidCoord = convertedRings.some(coord =>
                Math.abs(coord[1]) > 90 || Math.abs(coord[0]) > 180
            );
            if (invalidCoord) {
                console.error(`Feature[${featureIdx}].polygon[${multiIndex}] 座標超出有效範圍，已跳過`);
                showToast("⚠️ 部分座標超出有效範圍（lat: ±90°, lon: ±180°），已自動跳過");
                skippedCount++;
                return;
            }

            if (convertedRings.length > 1 &&
                convertedRings[0][0] === convertedRings[convertedRings.length - 1][0] &&
                convertedRings[0][1] === convertedRings[convertedRings.length - 1][1]) {
                convertedRings.pop();
            }

            const points = convertedRings.map(coord => [coord[1], coord[0]]);

            let finalName = null;
            if (baseName) {
                finalName = totalPolygons > 1
                    ? `${baseName}_${multiIndex + 1}`
                    : baseName;
            }

            const polygonObj = createPolygonObject(points, finalName);
            if (polygonObj) {
                polygonObj.originalProperties = { ...props };
                console.log(`✓ 已保留 Feature[${featureIdx}].polygon[${multiIndex}] 的原始屬性:`, props);
            }

            importedCount++;
        });
    });

    let msg = `✅ 成功匯入 ${importedCount} 個多邊形`;
    if (convertedCount > 0) msg += `（已自動轉換 ${convertedCount} 個 TWD97 座標）`;
    if (skippedCount > 0) msg += `，跳過 ${skippedCount} 筆異常資料`;
    showToast(msg);
    console.log(msg);
}

/* ========================================================================
   importPolygonsFromSHP 函數
   ======================================================================== */

function importPolygonsFromSHP(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    if (file.name.endsWith('.geojson') || file.name.endsWith('.json')) {
        reader.onload = (e) => {
            try {
                const rawGeoJSON = JSON.parse(e.target.result);
                console.log('📥 原始 GeoJSON 結構:', rawGeoJSON);

                const normalizedGeoJSON = normalizeGeoJSON(rawGeoJSON);
                console.log('✅ 規範化後的 GeoJSON:', normalizedGeoJSON);

                processImportedPolygons(normalizedGeoJSON);
            } catch (err) {
                console.error('❌ GeoJSON 解析失敗:', err);
                showToast(`❌ 解析失敗：${err.message}`);
            }
        };
        reader.readAsText(file);
    } else if (file.name.endsWith('.zip')) {
        reader.onload = (e) => {
            shp(e.target.result).then(geojson => {
                try {
                    console.log('📥 原始 SHP GeoJSON:', geojson);

                    const normalizedGeoJSON = normalizeGeoJSON(geojson);
                    console.log('✅ 規範化後的 GeoJSON:', normalizedGeoJSON);

                    processImportedPolygons(normalizedGeoJSON);
                } catch (err) {
                    console.error('❌ GeoJSON 規範化失敗:', err);
                    showToast(`❌ 規範化失敗：${err.message}`);
                }
            }).catch(err => {
                console.error('❌ SHP 解析失敗:', err);
                showToast('❌ SHP 解析失敗');
            });
        };
        reader.readAsArrayBuffer(file);
    } else {
        showToast('❌ 不支援的檔案格式（只支援 .geojson、.json 或 .zip）');
    }
    document.getElementById('shp-file-input').value = '';
}

/* ========================================================================
   拖曳面板
   ======================================================================== */

let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

const resultHeader = document.getElementById('resultHeader');
resultHeader.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true;
    const rect = resultPanel.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    resultPanel.style.position = 'fixed';
    resultPanel.style.zIndex = 10000;
});

document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    resultPanel.style.left = (e.clientX - dragOffsetX) + 'px';
    resultPanel.style.top = (e.clientY - dragOffsetY) + 'px';
});

document.addEventListener('mouseup', () => {
    isDragging = false;
});

/* ========================================================================
   初始化 GeoJSON 事件
   ======================================================================== */

document.addEventListener('DOMContentLoaded', () => {
    initGeoJSONEvents(map);
});

</script>
