<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市價徵收查估作業系統 v1.1.0 - 修復版</title>
    
    <!-- CDN 引入 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.1/proj4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        .toolbar {
            position: absolute; top: 10px; right: 10px;
            background-color: white; border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2); z-index: 999; padding: 10px;
        }
        .toolbar button {
            display: block; width: 100%; padding: 8px 12px; margin: 5px 0;
            background-color: #0078d4; color: white; border: none;
            border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .toolbar button:hover { background-color: #005a9e; }
        .console-hint {
            position: fixed; bottom: 10px; left: 10px;
            background-color: #4caf50; color: white; padding: 12px 15px;
            border-radius: 5px; font-size: 12px; z-index: 998;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="toolbar">
        <button onclick="importGeoJSON()">📥 匯入 GeoJSON</button>
        <button onclick="exportGeoJSON()">📤 匯出 GeoJSON</button>
        <button onclick="drawPolygon()">✏️ 繪製多邊形</button>
        <button onclick="clearAll()">🗑️ 清除全部</button>
        <button onclick="diagQuick()">🔍 快速檢查</button>
    </div>

    <div class="console-hint">
        💡 按 F12 打開 Console，執行: <br>
        <code>diagQuick()  diagVis()  diagCoord()</code>
    </div>

    <script>
        // ========== 全局變數 ==========
        let map, geoJsonLayers = {}, geoJsonFeatures = {}, polygons = [];
        let isDrawing = false, currentDrawingPoints = [];

        // ========== 修復版 normalizeGeoJSON 函數 ========== 
        function normalizeGeoJSON(geojson) {
            console.log('%c🔍 GeoJSON 正規化 (修復版)', 'color: blue; font-weight: bold;');
            console.log('輸入型態:', typeof geojson, '是陣列?', Array.isArray(geojson));
            
            // 基礎檢查
            if (!geojson || typeof geojson !== 'object') {
                console.error('❌ 無效的 GeoJSON');
                return { type: 'FeatureCollection', features: [] };
            }

            // 深拷貝確保數據清潔
            let data = JSON.parse(JSON.stringify(geojson));
            if (!data.type) data.type = 'FeatureCollection';

            console.log('features 型態:', typeof data.features, '是陣列?', Array.isArray(data.features));

            // ★ 關鍵修復：features 是物件時轉換為陣列
            if (data.features && typeof data.features === 'object' && !Array.isArray(data.features)) {
                console.warn('⚠️ features 是物件，嘗試修復...');
                
                const keys = Object.keys(data.features);
                console.log('  物件鍵值:', keys.slice(0, 5));

                // 策略 A：數字索引轉換 {0, 1, 2, ...}
                if (keys.every(k => /^\d+$/.test(k)) && keys.length > 0) {
                    console.log('  ✓ 轉換數字索引為陣列');
                    data.features = Object.values(data.features);
                }
                // 策略 B：別名鍵 data/results/records
                else if (data.features.data || data.features.results || data.features.records) {
                    const aliasKey = data.features.data ? 'data' : (data.features.results ? 'results' : 'records');
                    console.log('  ✓ 發現別名鍵:', aliasKey);
                    const val = data.features[aliasKey];
                    data.features = Array.isArray(val) ? val : [];
                }
                // 策略 C：將所有值轉換為陣列
                else {
                    console.log('  ✓ Object.values() 轉換');
                    data.features = Object.values(data.features);
                }

                console.log('  修復後長度:', data.features.length);
            }

            // 確保 features 是陣列
            if (!Array.isArray(data.features)) {
                console.warn('⚠️ 重置為空陣列');
                data.features = [];
            }

            // 展開嵌套 FeatureCollection
            let expanded = [];
            let iterations = 0;

            for (let i = 0; i < data.features.length && iterations < 10; i++) {
                const item = data.features[i];

                if (item && item.type === 'FeatureCollection' && Array.isArray(item.features)) {
                    console.log('  展開嵌套 FeatureCollection');
                    expanded.push(...item.features);
                    iterations++;
                } else if (item && item.type === 'Feature') {
                    expanded.push(item);
                } else if (item && ['Point', 'LineString', 'Polygon', 'MultiPolygon'].includes(item.type)) {
                    expanded.push({ type: 'Feature', geometry: item, properties: {} });
                }
            }

            data.features = expanded.length > 0 ? expanded : data.features;

            // MultiPolygon 拆分
            let final = [];
            data.features.forEach((f, idx) => {
                if (f.geometry && f.geometry.type === 'MultiPolygon') {
                    console.log('  拆分 MultiPolygon:', idx);
                    f.geometry.coordinates.forEach((coords, sub) => {
                        final.push({
                            ...f,
                            geometry: { type: 'Polygon', coordinates: coords },
                            properties: { ...f.properties, multiPolygonIndex: sub + 1 }
                        });
                    });
                } else {
                    final.push(f);
                }
            });

            data.features = final;

            // 最終驗證
            console.log('✅ 驗證:');
            console.log('  type:', data.type);
            console.log('  features 是陣列:', Array.isArray(data.features));
            console.log('  features 長度:', data.features.length);

            if (!Array.isArray(data.features)) {
                console.error('❌ 最終驗證失敗！');
                return { type: 'FeatureCollection', features: [] };
            }

            return data;
        }

        // ========== 修復版 importGeoJSON ==========
        function importGeoJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,.geojson';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        console.clear();
                        console.log('%c📥 開始匯入 GeoJSON', 'color: purple; font-weight: bold; font-size: 14px;');
                        console.log('檔案:', file.name, '大小:', (file.size/1024).toFixed(2), 'KB');

                        // JSON 解析
                        const geojson = JSON.parse(event.target.result);
                        console.log('✅ JSON 解析成功\n');

                        // 正規化
                        const normalized = normalizeGeoJSON(geojson);

                        // ★ 關鍵驗證
                        if (!normalized || typeof normalized !== 'object') {
                            throw new Error('正規化返回無效資料');
                        }

                        if (!Array.isArray(normalized.features)) {
                            throw new Error(
                                '❌ 正規化後 features 型態: ' + typeof normalized.features + 
                                ' (需要 array)\n\n詳見 Console 日誌'
                            );
                        }

                        console.log('✅ 驗證通過\n');

                        const layerName = file.name.split('.')[0];
                        geoJsonFeatures[layerName] = normalized;

                        // Leaflet 渲染
                        const layer = L.geoJSON(normalized, {
                            style: f => extractStyleFromProperties(f.properties || {}),
                            onEachFeature: (f, l) => l.bindPopup(createPropertyPopup(f.properties))
                        }).addTo(map);

                        geoJsonLayers[layerName] = layer;
                        if (layer.getBounds().isValid()) {
                            map.fitBounds(layer.getBounds());
                        }

                        console.log('%c✅ 匯入完成', 'color: green; font-weight: bold; font-size: 14px;');
                        console.log('圖層:', layerName, '特徵數:', normalized.features.length);

                        alert('✅ 成功加載: ' + layerName + '\n共 ' + normalized.features.length + ' 個特徵');

                    } catch (err) {
                        console.error('%c❌ 匯入失敗', 'color: red; font-weight: bold; font-size: 14px;');
                        console.error('錯誤:', err.message);
                        console.error(err);
                        alert('❌ 匯入失敗\n\n' + err.message + '\n\n打開 Console (F12) 查看詳細資訊');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ========== 輔助函數 ==========
        function extractStyleFromProperties(props) {
            return {
                color: props.stroke_color || '#333',
                fillColor: props.fill_color || props.color || '#3388ff',
                fillOpacity: 0.2,
                weight: 2
            };
        }

        function createPropertyPopup(props) {
            let html = '<table style="font-size:12px">';
            Object.entries(props || {}).forEach(([k, v]) => {
                html += '<tr><td style="font-weight:bold">' + k + '</td><td>' + v + '</td></tr>';
            });
            html += '</table>';
            return html;
        }

        function exportGeoJSON() {
            const allFeatures = [];
            Object.values(geoJsonFeatures).forEach(fc => {
                if (fc.features) allFeatures.push(...fc.features);
            });
            const geojson = { type: 'FeatureCollection', features: allFeatures };
            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'export_' + Date.now() + '.geojson';
            a.click();
            URL.revokeObjectURL(url);
        }

        function drawPolygon() {
            if (isDrawing) {
                isDrawing = false;
                alert('已取消繪製');
                return;
            }
            isDrawing = true;
            currentDrawingPoints = [];
            alert('開始繪製\n點擊添加頂點\n雙擊完成');
        }

        function clearAll() {
            if (confirm('確認清除所有圖層?')) {
                Object.values(geoJsonLayers).forEach(layer => map.removeLayer(layer));
                geoJsonLayers = {};
                geoJsonFeatures = {};
                polygons = [];
            }
        }

        // ========== 地圖初始化 ==========
        function initMap() {
            map = L.map('map').setView([25.0330, 121.5654], 13);
            
            const nlsc = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default//GoogleMapsCompatible_Level{z}/{y}/{x}.png', {
                maxZoom: 20, attribution: '© NLSC'
            });
            
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap'
            });

            nlsc.addTo(map);
            L.control.layers({ 'NLSC': nlsc, 'OSM': osm }).addTo(map);
            
            console.log('%c✅ 地圖初始化完成', 'color: green; font-weight: bold;');
        }

        // ========== 診斷工具 ==========
        window.diagQuick = function() {
            console.clear();
            console.log('%c⚠️ 快速診斷', 'color: blue; font-weight: bold; font-size: 14px;');
            console.log('✓ GeoJSON 圖層:', Object.keys(geoJsonLayers).length);
            console.log('✓ 總特徵數:', Object.values(geoJsonFeatures).reduce((s,f) => s + (f.features?.length||0), 0));
            console.log('✓ 多邊形:', polygons.length);
            console.log('✓ 地圖中心:', map.getCenter());
        };

        window.diagVis = function() {
            console.clear();
            console.log('%c👁️ 圖層可見性', 'color: blue; font-weight: bold;');
            Object.entries(geoJsonLayers).forEach(([name, layer]) => {
                console.log(layer._map ? '✓' : '✗', name);
            });
        };

        window.diagCoord = function() {
            console.clear();
            console.log('%c🔍 座標檢查', 'color: blue; font-weight: bold;');
            Object.entries(geoJsonFeatures).forEach(([name, data]) => {
                if (Array.isArray(data.features) && data.features.length > 0) {
                    const f = data.features[0];
                    if (f.geometry?.coordinates) {
                        console.log(name, '第一個座標:', f.geometry.coordinates);
                    }
                }
            });
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', initMap);
        console.log('%c🎉 系統已加載', 'color: blue; font-weight: bold;');
    </script>
</body>
</html>
