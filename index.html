<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市都市計畫圖資介接測試</title>
    
    <!-- 引入 Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <strong>新北市圖資介接測試</strong><br>
        右上角可切換底圖與開啟/關閉地籍圖疊加層。
    </div>

    <div id="map"></div>

    <!-- 引入 Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. 初始化地圖（中心點設為板橋/新北市政府附近）
        const map = L.map('map').setView([25.0115, 121.4650], 15);

        // 2. 定義圖層網址與設定
        const newTaipeiUrbanPlanLayers = {
            'tpc-basic': {
                name: '臺灣通用電子地圖',
                url: 'https://wmts.nlsc.gov.tw/wmts/EMAP/default/EPSG:3857/{z}/{y}/{x}',
                type: 'wmts'
            },
            'tpc-photo': {
                name: '正射影像圖',
                url: 'https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/EPSG:3857/{z}/{y}/{x}',
                type: 'wmts'
            },
            'tpc-cadastral': {
                name: '地籍圖',
                url: 'https://wmts.nlsc.gov.tw/wmts/CADASTRAL/default/EPSG:3857/{z}/{y}/{x}',
                type: 'wmts'
            }
        };

        // 3. 建立基本底圖圖層（Base Layers）
        const basicLayer = L.tileLayer(newTaipeiUrbanPlanLayers['tpc-basic'].url, {
            maxZoom: 19,
            attribution: '&copy; <a href="https://maps.nlsc.gov.tw/">國土測繪圖資服務雲</a>'
        });

        const photoLayer = L.tileLayer(newTaipeiUrbanPlanLayers['tpc-photo'].url, {
            maxZoom: 19,
            attribution: '&copy; <a href="https://maps.nlsc.gov.tw/">國土測繪圖資服務雲</a>'
        });

        // 預設將「通用電子地圖」加入地圖
        basicLayer.addTo(map);

        // 4. 建立疊加圖層（Overlays）- 地籍圖
        const cadastralLayer = L.tileLayer(newTaipeiUrbanPlanLayers['tpc-cadastral'].url, {
            maxZoom: 19,
            opacity: 0.7, // 設置半透明以便疊加觀察
            attribution: '&copy; <a href="https://maps.nlsc.gov.tw/">國土測繪圖資服務雲</a>'
        });

        // 5. 設定圖層切換選單控制項
        const baseMaps = {
            "臺灣通用電子地圖": basicLayer,
            "正射影像圖": photoLayer
        };

        const overlayMaps = {
            "地籍圖（半透明疊加）": cadastralLayer
        };

        // 將控制項加入地圖右上角
        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    </script>
</body>
</html>
